.sky { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; mix-blend-mode: soft-light; }
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: var(--glow, 1); background: radial-gradient(120% 95% at 58% 45%, transparent 52%, rgba(2, 5, 12, .6) 100%); }

.tl-top { display: flex; align-items: center; gap: 12px; }
.tl-play { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #0B1220; background: var(--day-accent); box-shadow: 0 0 0 4px rgba(var(--day-accent-rgb), .16), 0 0 24px rgba(var(--day-accent-rgb), .5); cursor: pointer; }
.tl-play:disabled { opacity: .35; box-shadow: none; cursor: default; }
.tl-play svg { width: 18px; height: 18px; fill: currentColor; }
.tl-read { flex: 1; min-width: 0; display: grid; gap: 3px; }
.tl-count { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: .86; color: #FFF4DE; text-shadow: 0 0 22px rgba(var(--day-accent-rgb), .4); font-variant-numeric: tabular-nums; }
.tl-when { font-size: 12px; line-height: 1.3; color: var(--text-2); }
.tl-side { flex: none; align-self: flex-start; }
.chip-live { display: inline-flex; align-items: center; gap: 7px; padding: 6px 2px; font-size: 12.5px; font-weight: 600; }
.chip-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: live-pulse 2s ease-out infinite; }
.chip-live.off { color: var(--text-2); }
.chip-live.off i { background: var(--text-2); animation: none; }
@keyframes live-pulse { 0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, .6); } 70%, 100% { box-shadow: 0 0 0 8px rgba(61, 220, 132, 0); } }

.spark { position: relative; height: 66px; touch-action: none; cursor: crosshair; }
.spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.spark input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none; }
.spark:focus-within { outline: 2px solid var(--day-accent); outline-offset: 5px; border-radius: 4px; }
.spark text { font-family: var(--font); font-size: 10.5px; fill: var(--text-2); font-variant-numeric: tabular-nums; }
.spark .daylight { fill: rgba(255, 196, 110, .1); }
.spark .daylabel { fill: rgba(255, 214, 160, .85); font-size: 9.5px; font-weight: 600; }
.spark .grid { stroke: rgba(255, 255, 255, .09); stroke-width: 1; }
.spark .base { stroke: rgba(255, 255, 255, .3); stroke-width: 1; }
.spark .area { fill: url(#spark-fill); }
.spark .line { fill: none; stroke: #C9830F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(255, 181, 71, .7)); }
.spark .pend { fill: rgba(255, 255, 255, .4); }
.spark .cursor { stroke: rgba(255, 255, 255, .8); stroke-width: 1; }
.spark .hover { stroke: rgba(255, 255, 255, .4); stroke-width: 1; }
.spark .dot { fill: var(--day-accent); stroke: #10151F; stroke-width: 2; }
.spark .ext { fill: #10151F; stroke: var(--day-accent); stroke-width: 1.5; }
.spark .val { fill: var(--text); font-size: 11px; font-weight: 700; }
.spark .halo { paint-order: stroke; stroke: #121823; stroke-width: 3px; stroke-linejoin: round; }
.tip { position: absolute; top: -4px; left: 0; z-index: 3; display: none; padding: 6px 10px 5px; border-radius: 10px; background: #F4F6F9; color: #0B1220; box-shadow: 0 8px 22px rgba(0, 0, 0, .4); font-size: 12px; line-height: 1.3; white-space: nowrap; pointer-events: none; }
.tip b { display: block; font-size: 15px; font-weight: 700; }
.tl-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.tl-note { font-size: 12px; color: var(--text-2); }

.hot { width: 0; height: 0; pointer-events: none; }
.hot-in { position: absolute; left: 0; top: 0; transition: opacity .3s, visibility .3s; }
.hots-hidden .hot-in, .hot.gone .hot-in { opacity: 0; visibility: hidden; }
.hot .ring { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #FFF1D6; box-shadow: 0 0 0 1.5px rgba(11, 18, 32, .75), 0 0 12px rgba(var(--day-accent-rgb), .55); }
.hot .ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(var(--day-accent-rgb), .9); animation: hot-ring 2.6s ease-out infinite; }
.hot .lead { position: absolute; left: 0; top: 0; height: 1.5px; display: none; background: rgba(255, 241, 214, .75); box-shadow: 0 0 0 1px rgba(11, 18, 32, .35); transform-origin: 0 50%; }
.hot.led .lead { display: block; }
.hot.compact .lbl span { display: none; }
.hot.compact .lbl i { display: inline; }
.hot .lbl i { display: none; font-style: normal; }
.hot.short .lbl i { display: none; }
.daylit .hot .ring { border: 2px solid #fff; box-shadow: 0 0 0 1.5px rgba(11, 18, 32, .7), 0 2px 10px rgba(0, 0, 0, .35); }
.hot.r2 .ring::after, .hot.r3 .ring::after { animation-delay: .9s; }
.daylit .hot .lead { height: 2px; background: rgba(11, 18, 32, .85); box-shadow: 0 0 0 1px rgba(255, 255, 255, .8); }
@keyframes hot-ring { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
.hot .lbl { position: absolute; left: 18px; top: -13px; display: flex; align-items: baseline; gap: 5px; padding: 4px 10px 4px 9px; white-space: nowrap; border-radius: 999px; background: rgba(9, 14, 24, .86); border: 1px solid var(--line); font-size: 11.5px; color: var(--text); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hot .lbl b { font-family: var(--display); font-size: 15px; font-weight: 800; color: var(--day-accent); }
.hot.short .lbl span, .hot.nolbl .lbl { display: none; }
.hint { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: none; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; pointer-events: none; }
@media (max-width: 640px), (max-height: 520px) { .hint.on { display: block; } }

@media (max-width: 640px), (max-height: 520px) {
  .tl-play { width: 44px; height: 44px; }

  .dmc-seg { flex: 1; justify-content: space-between; }
  .dmc-seg button { flex: 1; padding: 5px 6px; }
  .hot .lbl { font-size: 10.5px; padding: 3px 8px; }
  .hot .lbl b { font-size: 13px; }
}
@media (max-width: 640px) and (min-height: 780px) {

}
@media (max-height: 520px) and (orientation: landscape) {

  .tl-play { width: 40px; height: 40px; }
  .tl-count { font-size: 32px; }
  .spark { height: 50px; }
  .tl-note { display: none; }
}

<section id="panel" class="dmc-glass dmc-panel" data-dmc-overlay aria-label="Taxi count, 24-hour replay and lighting">

      <button type="button" data-mode="morning" aria-pressed="false" title="Sunrise"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 12.2h12.4M4.6 12.2a3.4 3.4 0 0 1 6.8 0M8 4.2v1.6M3.6 6.6l1.1 1.1M12.4 6.6l-1.1 1.1"/></svg>Morning</button>
      <button type="button" data-mode="day" aria-pressed="false" title="Full daylight"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M3.5 12.5l1.2-1.2M11.3 4.7l1.2-1.2"/></svg>Day</button>
      <button type="button" data-mode="night" aria-pressed="false" title="Full night"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 10.3A5.4 5.4 0 0 1 5.7 3a5.4 5.4 0 1 0 7.3 7.3z"/></svg>Night</button>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="kit/dmc.js"></script>
<script>
'use strict';
/* ===== Day 01 · Points ===== */
const DAY = {
  n: 1,
  title: 'Every available taxi, right now',
  deck: "Each light is a taxi free for hire, from LTA's live feed. Rings mark the three busiest spots, counting taxis within about 750 m. The map is lit by the sun's real position over Singapore, so the 24-hour replay runs from night to morning and back.",
  credit: 'Data: LTA via data.gov.sg',
  accent: '#FFB547',
  basemap: ['Night', 'Default'],   // night underneath, day brought in by the sun
  basemapBg: '#0B1220',
  creditsEl: 'credits',
  author: '',                      // optional: your name or handle, shown in the stamp footer
  nav: null,                       // optional: link the November grid to other days, e.g. '../day{nn}/'
  attribution: 'Taxi data: <a href="https://data.gov.sg/datasets/d_e25662f1a062dd046453926aa284ba64/view" target="_blank" rel="noopener noreferrer">LTA Taxi Availability</a>, data.gov.sg, <a href="https://data.gov.sg/open-data-licence" target="_blank" rel="noopener noreferrer">Open Data Licence</a>',
};
DMC.mountStamp(DAY);
const map = DMC.createMap(DAY);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);

/* ---------- time and sun ---------- */
const SGT = 8 * 3600e3;
const fmtHM = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmtDay = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Singapore', weekday: 'short', day: 'numeric', month: 'short' });
const nf = new Intl.NumberFormat('en-SG');
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
// Solar altitude in degrees over central Singapore (low-precision almanac, good to a few minutes).
function sunAltitude(ms) {
  const r = Math.PI / 180, lat = 1.3521 * r, lon = 103.8198;
  const d = ms / 864e5 + 2440587.5 - 2451545;
  const g = r * (357.529 + 0.98560028 * d);
  const L = r * (280.459 + 0.98564736 * d + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g));
  const e = r * (23.439 - 3.6e-7 * d);
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = r * (15 * gmst + lon) - ra;
  return Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H)) / r;
}

/* ---------- data ---------- */
const API = 'https://api.data.gov.sg/v1/transport/taxi-availability';
const STEP = 30 * 60e3;   // one snapshot every 30 minutes
const HIST = 48;          // 24 hours of history
const LIVE = HIST;        // the last slot holds the live snapshot
// One request every 2.1 s keeps under data.gov.sg's public limit of 6 per 10 s.
// For local testing only, ?gap=200 shortens the spacing.
const GAP = Math.max(150, Number(params.get('gap')) || 2100);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sgtParam = t => new Date(t + SGT).toISOString().slice(0, 19);
const anchor = Math.floor(Date.now() / STEP) * STEP;
const slots = Array.from({ length: HIST + 1 }, (_, i) => ({
  i, live: i === LIVE, t: i < HIST ? anchor - (HIST - i) * STEP : 0, status: 'idle',
}));
const slotTime = s => (s.live ? (s.ts ? s.ts.getTime() : Date.now()) : s.t);
const shownTime = s => (s.live ? s.ts : new Date(s.t));   // history is labelled by its half-hour slot
const isOk = i => !!slots[i] && slots[i].status === 'ok';

// Positions are stored relative to a Singapore origin so 32-bit floats stay precise at street zoom.
const ORIGIN = maplibregl.MercatorCoordinate.fromLngLat([103.82, 1.35]);
function pack(coords) {
  const a = new Float32Array(coords.length * 3);
  for (let k = 0; k < coords.length; k++) {
    const [lng, lat] = coords[k];
    a[k * 3] = (lng + 180) / 360 - ORIGIN.x;
    a[k * 3 + 1] = (180 - (180 / Math.PI) * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))) / 360 - ORIGIN.y;
    const h = Math.sin(lng * 12.9898 + lat * 78.233) * 43758.5453;
    a[k * 3 + 2] = h - Math.floor(h);
  }
  return a;
}

async function fetchSnapshot(dateTime) {
  const url = dateTime ? `${API}?date_time=${encodeURIComponent(dateTime)}` : API;
  // A hung request would stall the queue, live refresh included, so give up after 15 s.
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  let json;
  try {
    const res = await fetch(url, { headers: { Accept: 'application/json' }, signal: ctl.signal });
    if (res.status === 429) { const e = new Error('Rate limited'); e.rate = true; throw e; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    json = await res.json();
  } finally {
    clearTimeout(timer);
  }
  const f = json && json.features && json.features[0];
  const coords = f && f.geometry && f.geometry.coordinates;
  if (!Array.isArray(coords)) throw new Error('No taxi positions in the response');
  const p = f.properties || {};
  return { ts: new Date(p.timestamp || Date.now()), count: Number.isFinite(p.taxi_count) ? p.taxi_count : coords.length, coords, gl: pack(coords), hot: null };
}

// One request at a time. A 429, or one network failure (a 429 from a gateway can arrive
// without CORS headers and look like one), waits for the 10-second window to reset.
const net = { q: [], busy: false, last: 0, gap: GAP };
function request(dateTime, urgent) {
  return new Promise((resolve, reject) => {
    const job = { dateTime, resolve, reject, tries: 0, soft: false };
    if (urgent) net.q.unshift(job); else net.q.push(job);
    drain();
  });
}
async function drain() {
  if (net.busy) return;
  net.busy = true;
  while (net.q.length) {
    const wait = net.last + net.gap - Date.now();
    if (wait > 0) { await sleep(wait); continue; }
    if (document.hidden) { await new Promise(r => document.addEventListener('visibilitychange', r, { once: true })); continue; }
    const job = net.q.shift();
    net.last = Date.now();
    try {
      job.resolve(await fetchSnapshot(job.dateTime));
      net.gap = Math.max(GAP, net.gap * 0.85);
    } catch (err) {
      const softRate = (err instanceof TypeError || err.name === 'AbortError') && !job.soft;   // network failure or timeout
      if ((err.rate && job.tries < 5) || softRate) {
        if (softRate) job.soft = true; else job.tries++;
        net.gap = Math.min(8000, net.gap * 1.5);
        net.last = Date.now() + 10000;
        net.q.unshift(job);
      } else {
        job.reject(err);
      }
    }
  }
  net.busy = false;
}

// Newest first, then halve the gaps (12 h, 6 h, 3 h ...) so the chart sharpens as it loads.
function coarseToFine(n) {
  const order = [], seen = new Set(), last = n - 1;
  for (const step of [n, n / 2, n / 4, n / 8, n / 16, 2, 1].map(Math.round)) {
    for (let i = last; i >= 0; i--) {
      if ((last - i) % step === 0 && !seen.has(i)) { seen.add(i); order.push(i); }
    }
  }
  return order;
}
async function backfill() {
  for (let pass = 0; pass < 2; pass++) {
    for (const i of coarseToFine(HIST).filter(k => !isOk(k))) {
      const s = slots[i];
      s.status = 'loading';
      try {
        Object.assign(s, await request(sgtParam(s.t)), { status: 'ok' });
      } catch (err) {
        s.status = 'error';
        console.warn(`Snapshot ${sgtParam(s.t)} failed:`, err.message);
      }
      onSlot(i);
    }
  }
}
let livePending = false;
async function refreshLive() {
  if (livePending) return;
  livePending = true;
  try {
    Object.assign(slots[LIVE], await request(null, true), { status: 'ok' });
    onSlot(LIVE);
  } catch (err) {
    console.error('Live taxi request failed:', err);
    if (!isOk(LIVE)) showError();
  } finally {
    livePending = false;
  }
}

/* ---------- taxi lights ----------
   Night: every taxi is drawn as an instanced quad into an offscreen light buffer
   (half-float where the GPU allows), summed additively. A quarter-size copy is
   blurred for bloom. The composite tone-maps the summed light so dense clusters
   saturate to amber-gold instead of clipping to white, then adds it to the map.
   Day: the same quads drawn as halo, then every dark rim, then every amber fill,
   so clusters merge into one shape with one outline. */
const SPRITE_VS = `
attribute vec2 a_corner;
attribute vec2 a_pos;
attribute float a_seed;
uniform mat4 u_matrix;
uniform vec2 u_viewport;
uniform float u_size;
uniform float u_time;
uniform float u_twinkle;
varying vec2 v_c;
void main() {
  vec4 p = u_matrix * vec4(a_pos, 0.0, 1.0);
  float tw = 1.0 + u_twinkle * 0.14 * sin(u_time * (1.1 + a_seed * 1.6) + a_seed * 61.0);
  float s = u_size * (0.82 + 0.36 * a_seed) * tw;
  p.xy += a_corner * (s / u_viewport) * p.w;
  gl_Position = p;
  v_c = a_corner;
}`;
const LIGHT_FS = `
precision mediump float;
varying vec2 v_c;
uniform float u_alpha;
uniform float u_scale;
void main() {
  float r2 = dot(v_c, v_c);
  if (r2 > 1.0) discard;
  float core = exp(-r2 * 70.0);
  float halo = exp(-r2 * 9.0) * (1.0 - r2);
  vec3 col = vec3(1.0, 0.94, 0.8) * core * 1.6 + vec3(1.0, 0.6, 0.17) * halo * 0.55;
  gl_FragColor = vec4(col * u_alpha * u_scale, 1.0);
}`;
const DOT_FS = `
precision mediump float;
varying vec2 v_c;
uniform float u_alpha;
uniform float u_mode;
void main() {
  float r2 = dot(v_c, v_c);
  if (r2 > 1.0) discard;
  float r = sqrt(r2);
  vec3 col;
  float a;
  if (u_mode < 1.5) { col = vec3(1.0, 0.62, 0.2); a = exp(-r2 * 3.0) * (1.0 - r2) * 0.22; }
  else if (u_mode < 2.5) { col = vec3(0.2, 0.11, 0.02); a = (1.0 - smoothstep(0.56, 0.66, r)) * 0.9; }
  else { col = vec3(0.96, 0.6, 0.13); a = 1.0 - smoothstep(0.4, 0.48, r); }
  a *= u_alpha;
  gl_FragColor = vec4(col * a, a);
}`;
const CORE_FS = `
precision mediump float;
varying vec2 v_c;
uniform float u_alpha;
void main() {
  float r2 = dot(v_c, v_c);
  if (r2 > 1.0) discard;
  float core = exp(-r2 * 8.2) * u_alpha;   // = exp(-80 r^2) on a quad 0.32x the light's size
  gl_FragColor = vec4(vec3(1.0, 0.95, 0.84) * core, 0.0);
}`;
const QUAD_VS = `
attribute vec2 a_corner;
varying vec2 v_uv;
void main() { v_uv = a_corner * 0.5 + 0.5; gl_Position = vec4(a_corner, 0.0, 1.0); }`;
const DOWN_FS = `
precision mediump float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2 u_texel;
uniform float u_gain;

    x: t => M.l + (t - t0) / (t1 - t0) * (W - M.l - M.r),
    y: v => M.t + (1 - v / top) * (H - M.t - M.b),
  };
}
function drawSpark() {
  const g = geometry();
  if (!g.W) return;
  svg.replaceChildren();
  svg.setAttribute('viewBox', `0 0 ${g.W} ${g.H}`);
  const defs = sv('defs', {});
  const grad = sv('linearGradient', { id: 'spark-fill', x1: 0, y1: 0, x2: 0, y2: 1 }, null, defs);
  sv('stop', { offset: '0%', 'stop-color': '#FFB547', 'stop-opacity': 0.32 }, null, grad);
  sv('stop', { offset: '100%', 'stop-color': '#FFB547', 'stop-opacity': 0 }, null, grad);

  // Daylight bands (sun above the horizon), from the same sun model that lights the map.
  let start = null, widest = null;
  for (let t = g.t0; t <= g.t1 + 1; t += 5 * 60e3) {
    const up = sunAltitude(t) > -0.833;
    if (up && start === null) start = t;
    if ((!up || t + 5 * 60e3 > g.t1) && start !== null) {
      const x0 = g.x(start), x1 = g.x(Math.min(t, g.t1));
      sv('rect', { class: 'daylight', x: x0, y: M.t - 8, width: Math.max(0, x1 - x0), height: g.base - M.t + 8 });
      if (!widest || x1 - x0 > widest[1] - widest[0]) widest = [x0, x1];
      start = null;
    }
  }
  const labels = view.hover < 0;   // the tooltip replaces direct labels while it shows
  const compact = g.H < 70;
  // Things labels must not touch: the replay cursor and the drag hint.
  const blockers = [];
  const shownSlot = slots[view.shown];
  if (shownSlot && shownSlot.status === 'ok' && view.shown !== LIVE) blockers.push({ x: g.x(slotTime(shownSlot)) - 4, y: 0, width: 8, height: g.H });
  if (getComputedStyle(hintEl).display !== 'none') blockers.push({ x: hintEl.offsetLeft - hintEl.offsetWidth / 2, y: hintEl.offsetTop, width: hintEl.offsetWidth, height: hintEl.offsetHeight });
  const hitsAny = (box, list) => list.some(q => !(box.x + box.width + 4 < q.x || q.x + q.width + 4 < box.x || box.y + box.height < q.y || q.y + q.height < box.y));
  let dayLbl = null;   // drawn under the line; dropped below if a value label needs its spot
  if (labels && widest && widest[1] - widest[0] > 70) {
    dayLbl = sv('text', { class: 'daylabel', x: widest[0] + 5, y: M.t + 1 }, 'Daylight');
    if (hitsAny(dayLbl.getBBox(), blockers)) { dayLbl.remove(); dayLbl = null; }
  }

  for (let v = g.step; v <= g.max; v += g.step) {
    const yy = Math.round(g.y(v)) + 0.5;
    sv('line', { class: 'grid', x1: M.l, x2: g.W, y1: yy, y2: yy });
    if (!compact) sv('text', { x: M.l - 6, y: yy + 3.5, 'text-anchor': 'end' }, nf.format(v));
  }
  if (!compact) sv('text', { x: M.l - 6, y: g.base + 3.5, 'text-anchor': 'end' }, '0');
  const H6 = 6 * 3600e3;
  for (let t = Math.ceil((g.t0 + SGT) / H6) * H6 - SGT; t < g.t1; t += H6) {
    const xx = Math.round(g.x(t)) + 0.5;
    if (xx > g.W - 46) continue;
    sv('line', { class: 'grid', x1: xx, x2: xx, y1: M.t - 4, y2: g.base });
    sv('text', { x: xx, y: g.H - 4, 'text-anchor': xx < M.l + 16 ? 'start' : 'middle' }, fmtHM.format(t));
  }
  sv('text', { x: g.W, y: g.H - 4, 'text-anchor': 'end' }, 'Now');
  sv('line', { class: 'base', x1: M.l, x2: g.W, y1: g.base + 0.5, y2: g.base + 0.5 });

  for (const s of slots) if (!s.live && s.status !== 'ok') sv('rect', { class: 'pend', x: g.x(s.t) - 1, y: g.base - 4, width: 2, height: 2 });
  const ok = slots.filter(s => s.status === 'ok');
  const pts = ok.map(s => [g.x(slotTime(s)), g.y(s.count)]);
  if (pts.length > 1) {
    const d = pts.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
    sv('path', { class: 'area', d: `${d}L${pts[pts.length - 1][0].toFixed(1)},${g.base}L${pts[0][0].toFixed(1)},${g.base}Z` });
    sv('path', { class: 'line', d });
  }
  const lv = slots[LIVE], taken = [...blockers];
  const clear = box => !hitsAny(box, taken);
  if (labels && lv.status === 'ok') {
    const ex = g.x(slotTime(lv)), ey = g.y(lv.count);
    const t = sv('text', { class: 'val halo', x: ex - 9, y: Math.max(11, ey - 7), 'text-anchor': 'end' }, nf.format(lv.count));
    const box = t.getBBox();
    if (clear(box)) taken.push(box); else t.remove();
  }
  if (labels && ok.length >= 24) {   // most and fewest, once most of the day has loaded, never on top of another label
    const hi = ok.reduce((a, b) => (b.count > a.count ? b : a)), lo = ok.reduce((a, b) => (b.count < a.count ? b : a));
    for (const [s, word] of [[hi, 'Most'], [lo, 'Fewest']]) {
      const x = g.x(slotTime(s)), y = g.y(s.count);
      if (s.live) continue;
      const t = sv('text', { class: 'val halo', x: Math.min(Math.max(x, M.l + 30), g.W - 40), y: y - 7, 'text-anchor': 'middle' }, `${word} ${nf.format(s.count)}`);
      const box = t.getBBox();
      if (box.x + box.width > g.W || !clear(box)) { t.remove(); continue; }
      taken.push(box);
      sv('circle', { class: 'ext', cx: x, cy: y, r: 3 });
    }
  }
  if (dayLbl && hitsAny(dayLbl.getBBox(), taken)) dayLbl.remove();   // the numbers matter more
  if (view.hover >= 0 && isOk(view.hover)) {
    const hx = Math.round(g.x(slotTime(slots[view.hover]))) + 0.5;
    sv('line', { class: 'hover', x1: hx, x2: hx, y1: M.t - 8, y2: g.base });
  }
  const sh = slots[view.shown];
  if (sh && sh.status === 'ok' && view.shown !== LIVE) {
    const cx = Math.round(g.x(slotTime(sh))) + 0.5;
    sv('line', { class: 'cursor', x1: cx, x2: cx, y1: M.t - 8, y2: g.base });
    sv('circle', { class: 'dot', cx, cy: g.y(sh.count), r: 4.5 });
  }
  if (lv.status === 'ok') sv('circle', { class: 'dot', cx: g.x(slotTime(lv)), cy: g.y(lv.count), r: 4.5 });
}
function indexAt(clientX) {
  const r = sparkBox.getBoundingClientRect(), g = geometry(), px = clientX - r.left;
  let best = 0, bd = Infinity;
  slots.forEach((s, i) => { const d = Math.abs(g.x(slotTime(s)) - px); if (d < bd) { bd = d; best = i; } });
  return best;
}
function showTip(i) {
  if (i < 0 || !isOk(i)) return hideTip();
  view.hover = i;
  const s = slots[i], g = geometry(), t = shownTime(s);
  const b = document.createElement('b');
  b.textContent = `${nf.format(s.count)} taxis`;
  tip.replaceChildren(b, document.createTextNode(`${fmtHM.format(t)}, ${fmtDay.format(t)}`));
  tip.style.display = 'block';
  const w = tip.offsetWidth, x = g.x(slotTime(s));
  tip.style.left = `${x + 12 + w <= g.W ? x + 12 : Math.max(M.l, x - 12 - w)}px`;
  drawSpark();
}
function hideTip() {
  if (view.hover < 0) return;
  view.hover = -1;
  tip.style.display = 'none';
  drawSpark();
}
let dragging = false;
sparkBox.addEventListener('pointerdown', e => {
  noteTouched();
  dragging = true;
  sparkBox.setPointerCapture(e.pointerId);
  scrub.focus({ preventScroll: true });
  setTarget(indexAt(e.clientX), true);
});
sparkBox.addEventListener('pointermove', e => {
  const i = indexAt(e.clientX);
  if (dragging) setTarget(i, true);
  if (e.pointerType === 'mouse' || dragging) showTip(nearestLoaded(i));
});
sparkBox.addEventListener('pointerup', e => { dragging = false; if (e.pointerType !== 'mouse') hideTip(); });
sparkBox.addEventListener('pointercancel', () => { dragging = false; hideTip(); });
sparkBox.addEventListener('pointerleave', () => { if (!dragging) hideTip(); });
scrub.addEventListener('input', () => { noteTouched(); setTarget(Number(scrub.value), true); showTip(view.shown); });
scrub.addEventListener('blur', hideTip);
new ResizeObserver(() => drawSpark()).observe(sparkBox);

/* ---------- map layers ---------- */
map.on('load', () => {
  const veil = { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[102.5, 0.4], [105.5, 0.4], [105.5, 2.4], [102.5, 2.4], [102.5, 0.4]]] } };
  map.addSource('veil', { type: 'geojson', data: veil });
  map.addLayer({ id: 'shade', type: 'fill', source: 'veil', paint: { 'fill-color': '#030812', 'fill-opacity': 0 } });
  map.addLayer(glow);
  mapReady = true;
  if (isOk(view.shown)) display(view.shown); else lightTarget();
});

/* ---------- animation loop: easing light, count, crossfades, twinkle ----------
   Runs only while something moves. The twinkle keeps going for 20 s after the last
   activity, at 10 frames a second, then the map rests. */
let rafOn = false, lastT = 0, lastTwinkle = 0, activeUntil = 0;
function kick(ms = 20000) {
  activeUntil = Math.max(activeUntil, performance.now() + ms);
  if (!rafOn) { rafOn = true; lastT = performance.now(); requestAnimationFrame(loop); }
}
function loop(now) {
  const dt = Math.min(100, now - lastT);
  lastT = now;
  let busy = false;
  if (light.alt !== null && Math.abs(light.alt - light.target) > 0.05) {
    light.alt += (light.target - light.alt) * (1 - Math.exp(-dt / 280));
    applyLight();
    busy = true;
  }
  if (glow.mix < 1) { glow.mix = Math.min(1, glow.mix + dt / 280); busy = true; }
  if (counter.t0) {
    const p = Math.min(1, (now - counter.t0) / 300);
    counter.cur = Math.round(counter.from + (counter.to - counter.from) * (1 - (1 - p) ** 3));
    countEl.textContent = nf.format(counter.cur);
    if (p >= 1) counter.t0 = 0;
  }
  const twinkling = mapReady && glow.night > 0.05 && !reduceMotion && now < activeUntil;
  if (mapReady) {
    if (busy) map.triggerRepaint();
    else if (twinkling && now - lastTwinkle > 100) { lastTwinkle = now; map.triggerRepaint(); }
  }
  if (busy || twinkling || counter.t0 || view.playing) requestAnimationFrame(loop);
  else rafOn = false;
}

/* ---------- start ---------- */
drawSpark();
refreshLive();
backfill();
setInterval(refreshLive, 60e3);
kick();
</script>
</body>
