<!DOCTYPE html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<title>Day 04 · Where Singapore's Trades Huddle</title>
<meta name="description" content="#30DayMapChallenge 2026, day 4, Clusters: every live business in ACRA's register, by trade. Pick one and watch it gather: specialists in Mount Elizabeth, computer shops in Sim Lim Square, maid agencies in Bukit Timah Shopping Centre.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="kit/dmc.css">
<style>
/* ===== Day 04: each trade raised as mountains; one dot per business, at its own address ===== */
:root { --c: #FFC24B; --c-rgb: 255, 194, 75; }

/* light mode: paper glass, ink text, no glows */
html.light { --glass: rgba(255, 255, 255, .86); --line: rgba(20, 32, 52, .13); --text: #142033; --text-2: rgba(20, 32, 51, .7); color-scheme: light; }
html.light .dmc-glass { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 10px 30px rgba(30, 45, 70, .16); }
html.light :is(.dmc-more, .dmc-btn, .step, .hots button, .list-close) { background: rgba(20, 32, 52, .05); }
html.light :is(.dmc-more, .dmc-btn, .step):hover, html.light .rank button:hover { background: rgba(20, 32, 52, .09); }
html.light .dmc-num, html.light .score .big { text-shadow: none; }
html.light .dmc-index li { box-shadow: inset 0 0 0 1px rgba(20, 32, 52, .16); }
html.light .dmc-index li.done { background: rgba(20, 32, 52, .1); }
html.light .dmc-index li.today { color: #fff; box-shadow: none; }
html.light .dmc-credits a { text-decoration-color: rgba(20, 32, 52, .3); }
html.light .dmc-focus-credit { background: rgba(255, 255, 255, .75); }
html.light .maplibregl-ctrl-group button .maplibregl-ctrl-icon, html.light .maplibregl-ctrl-attrib-button { filter: none; }
html.light .rank .bar { background: rgba(20, 32, 52, .08); }
html.light .rank .nm::before, html.light .sq .box.t { box-shadow: none; }
html.light .sq .box { border-color: rgba(20, 32, 52, .4); }
html.light .hs-box { background: rgba(255, 255, 255, .94); box-shadow: 0 2px 10px rgba(30, 45, 70, .2); }
html.light .hs:hover .hs-box, html.light .hs:focus-visible .hs-box { background: rgba(var(--c-rgb), .14); }
/* the basemap list, beside the map buttons */
.bases { position: fixed; z-index: 5; width: 200px; padding: 7px; display: grid; gap: 2px; }
.bases[hidden] { display: none; }
.bases-h { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); padding: 1px 5px 4px; }
.bases-l { display: grid; gap: 2px; }
.bases-l button { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; padding: 4px 6px; font: inherit; font-size: 12px; font-weight: 600; text-align: left; color: var(--text-2); background: none; border: 0; border-radius: 8px; cursor: pointer; }
.bases-l button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
html.light .bases-l button:hover { background: rgba(20, 32, 52, .06); }
.bases-l button[aria-pressed="true"] { color: var(--text); background: rgba(var(--day-accent-rgb), .14); box-shadow: inset 0 0 0 1px rgba(var(--day-accent-rgb), .45); }
.bases-l .sw { flex: none; width: 34px; height: 24px; border-radius: 5px; background: center / cover no-repeat; box-shadow: inset 0 0 0 1px var(--line); }
.bases-l .sw.plain { background: linear-gradient(135deg, #0B1426 0 50%, #EDEFF2 50% 100%); }
/* the theme button shows where it would take you: a sun in the dark, a moon in the light */
#theme .moon, html.light #theme .sun { display: none; }
html.light #theme .moon { display: inline; }

/* summit signs, placed by script on the land */
.signs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; transition: opacity .6s; }
.hs { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform; display: grid; justify-items: center; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: var(--text); }
.hs-box { display: flex; align-items: baseline; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 7px; white-space: nowrap; font-size: 11px; font-weight: 600;
  background: rgba(9, 14, 24, .86); border: 1px solid rgba(var(--c-rgb), .55); box-shadow: 0 0 14px rgba(var(--c-rgb), .25); }
.hs-box b { font-family: var(--display); font-size: 15px; font-weight: 800; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.hs.top .hs-box { font-size: 12.5px; padding: 4px 11px 4px 9px; }
.hs.top .hs-box b { font-size: 18px; }
.hs-stem { width: 1.5px; height: 14px; background: linear-gradient(rgba(var(--c-rgb), .9), rgba(var(--c-rgb), 0)); }
.hs.hide { visibility: hidden; }
.hs:hover .hs-box, .hs:focus-visible .hs-box { background: rgba(var(--c-rgb), .22); outline: none; }

/* the ranked list */
.list { top: calc(var(--gutter) + env(safe-area-inset-top, 0px) + 112px); left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
  bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); width: 288px; display: grid; grid-template-rows: auto 1fr auto; padding: 10px 6px 8px 10px; }
.list-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 6px 6px 2px; }
.list-h h2 { font-family: var(--display); font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.list-h p { font-size: 10.5px; color: var(--text-2); }
.list-close { display: none; }
.rank { list-style: none; margin: 0; padding: 0 4px 0 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
.rank button { width: 100%; display: grid; grid-template-columns: 18px 1fr 92px; align-items: center; gap: 6px; text-align: left; font: inherit; color: var(--text-2);
  background: none; border: 0; border-radius: 7px; padding: 4px 6px 4px 2px; min-height: 28px; cursor: pointer; }
.rank button:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.rank button[aria-pressed="true"] { background: rgba(var(--c-rgb), .14); color: var(--text); box-shadow: inset 0 0 0 1px rgba(var(--c-rgb), .45); }
.rank .no { font-size: 10px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
.rank .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.rank .nm::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--k); box-shadow: 0 0 6px var(--k); }
.rank .x { display: grid; grid-template-columns: 1fr 34px; align-items: center; gap: 5px; }
.rank .bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.rank .bar i { display: block; height: 100%; width: var(--w); background: var(--k); border-radius: 2px; }
.rank .x b { font-size: 11.5px; font-weight: 700; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.list .dmc-credits { border-top: 1px solid var(--line); padding: 7px 4px 0 2px; margin-top: 6px; font-size: 9.5px; }

/* the reading for the chosen trade */
.card { right: calc(var(--gutter) + env(safe-area-inset-right, 0px)); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); width: 352px; padding: 12px 14px 12px; display: grid; gap: 9px; }
.card-h { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.card-t { min-width: 0; }
.kick { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.card h2 { font-family: var(--display); font-size: 25px; font-weight: 800; line-height: 1; letter-spacing: .01em; }
.step { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); cursor: pointer; }
.step::after { content: ""; position: absolute; inset: -7px; }
.step:hover { background: rgba(255, 255, 255, .13); }
.step svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.score { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 12px; }
.score .big { font-family: var(--display); font-size: 46px; font-weight: 900; line-height: .85; color: var(--c); text-shadow: 0 0 18px rgba(var(--c-rgb), .45); font-variant-numeric: tabular-nums; }
.score .big small { font-size: 26px; }
.score p { font-size: 12px; line-height: 1.4; color: var(--text-2); }
.score p b { color: var(--text); font-weight: 600; }
.leg { font-size: 10.5px; line-height: 1.4; color: var(--text-2); }
.leg b { color: var(--c); font-weight: 700; }
.sq { display: flex; align-items: flex-end; gap: 14px; }
.sq figure { margin: 0; display: grid; justify-items: start; gap: 4px; }
.sq figcaption { font-size: 10.5px; line-height: 1.3; color: var(--text-2); }
.sq figcaption b { display: block; color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; }
.sq .box { border: 1.5px dashed rgba(255, 255, 255, .45); border-radius: 2px; }
.sq .box.t { border: 0; background: var(--c); box-shadow: 0 0 12px rgba(var(--c-rgb), .6); }
.hots { display: flex; flex-wrap: wrap; gap: 5px; }
.hots button { display: inline-flex; align-items: baseline; gap: 5px; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text); background: rgba(255, 255, 255, .06);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; min-height: 26px; cursor: pointer; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hots button b { color: var(--c); font-variant-numeric: tabular-nums; }
.hots button:hover { background: rgba(var(--c-rgb), .16); }
.card-f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-f .dmc-btn { display: inline-flex; align-items: center; gap: 6px; }
.card-f .dmc-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#open-list { display: none; }
.hint { font-size: 10.5px; color: var(--text-2); margin-left: auto; }

/* ---- compact screens: the list becomes a sheet you open ---- */
@media (max-width: 900px) {
  .list { display: none; }
  .list.open { display: grid; z-index: 4; }
  .list-close { display: inline-flex; font: inherit; font-size: 11px; font-weight: 600; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; min-height: 26px; cursor: pointer; }
  #open-list { display: inline-flex; }
  .hint { display: none; }
}
@media (max-width: 640px), (max-height: 520px) {
  .card { padding: 9px 11px 10px; gap: 7px; }
  .card h2 { font-size: 21px; }
  .score .big { font-size: 36px; }
  .score .big small { font-size: 21px; }
  .score p { font-size: 11.5px; }
  .sq, .leg { display: none; }
  .hots { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .hots::-webkit-scrollbar { display: none; }
  .hots button { flex: none; }
  .hs-box { font-size: 10px; padding: 2px 7px; }
  .hs-box b { font-size: 13px; }
  .hs.top .hs-box { font-size: 11px; }
  .hs.top .hs-box b { font-size: 15px; }
}
@media (max-width: 640px) and (orientation: portrait) {
  .card { left: 0; right: 0; bottom: 0; width: auto; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .list.open { top: auto; left: var(--gutter); right: var(--gutter); width: auto; bottom: calc(var(--card-h, 220px) + 8px); max-height: calc(100% - var(--card-h, 220px) - 120px); }
}
@media (max-height: 520px) and (orientation: landscape) {
  .card { width: min(330px, 46vw); right: calc(var(--gutter) + 48px); }
  #say { display: none; }
  .list.open { top: calc(var(--gutter) + 82px); width: 260px; }
}
</style>
</head>
<body>
<div id="map" class="dmc-map" role="region" aria-label="Map of Singapore raised into mountains for the chosen trade: the taller the peak, the more of the trade stands there; every live business as faint dust, and the trade as bright dots on the summits"></div>

<div id="bases" class="dmc-glass dmc-chrome bases" role="group" aria-label="Basemap" hidden>
  <p class="bases-h">Basemap</p>
  <div id="bases-l" class="bases-l"></div>
</div>

<header id="dmc-stamp" class="dmc-glass dmc-stamp" data-dmc-overlay></header>

<section id="list" class="dmc-glass list" data-dmc-overlay aria-label="Trades, most huddled first">
  <div class="list-h">
    <h2>Most huddled trades</h2>
    <p>× a random mix</p>
    <button id="list-close" class="list-close" type="button">Close</button>
  </div>
  <ol id="rank" class="rank"></ol>
  <p id="credits" class="dmc-credits"></p>
</section>

<section id="card" class="dmc-glass card" data-dmc-overlay aria-live="polite" aria-label="The chosen trade">
  <div class="card-h">
    <button id="prev" class="step" type="button" aria-label="More huddled trade"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <div class="card-t"><p id="kick" class="kick">&nbsp;</p><h2 id="name">Loading&hellip;</h2></div>
    <button id="next" class="step" type="button" aria-label="Less huddled trade"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
  </div>
  <div class="score">
    <p id="big" class="big">&nbsp;</p>
    <p id="say">Reading ACRA's register&hellip;</p>
  </div>
  <p id="leg" class="leg"></p>
  <div id="sq" class="sq" aria-hidden="true"></div>
  <div id="hots" class="hots" aria-label="Where they gather"></div>
  <div class="card-f">
    <button id="open-list" class="dmc-btn" type="button" aria-controls="list" aria-expanded="false">All trades</button>
    <span class="hint">&larr; &rarr; keys step through the list</span>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="kit/dmc.js"></script>
<script>
'use strict';
const A = (href, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`;
const DAY = { n: 4, title: 'Where Singapore\'s trades huddle',
  deck: 'ACRA registers every business in Singapore with an industry code and an address. Pick a trade and the island rises into its mountains: the height is how much of the trade stands within about half a kilometre, on one scale for every trade, so the tallest peaks are where a trade crowds hardest. Each of its businesses is a dot at its own registered address, lifted onto the land. The score is how much less ground holds half of them than half of the same number of businesses picked at random would need. Addresses are the ones registered with ACRA, which for shops and clinics is nearly always the shop; units shared by ten or more firms (company secretaries, registered-office services) are left out, and each address counts once per trade.',
  accent: '#FFC24B', basemapBg: '#0B1426',
  styleCredit: 'Basemap: ' + A('https://openfreemap.org/', 'OpenFreeMap') + ', ' + A('https://www.openmaptiles.org/', '&copy; OpenMapTiles') + ', &copy; ' + A('https://www.openstreetmap.org/copyright', 'OpenStreetMap') + ' contributors',
  bounds: [[103.72, 1.275], [103.96, 1.41]], buildings: false, creditsEl: 'credits',   // tight: the tilt shrinks the far shore
  camera: { pitch: 55, bearing: -16, tiltPitch: 55 },
  attribution: ['Businesses: ' + A('https://data.gov.sg/collections/2/view', 'ACRA Information on Corporate Entities') + ', live entities, October 2026, via data.gov.sg, Singapore Open Data Licence',
    'Trades: ' + A('https://www.singstat.gov.sg/standard-classifications/national-classifications/singapore-standard-industrial-classification-ssic', 'SSIC 2025') + ', Singapore Department of Statistics',
    'Postal code locations: ' + A('https://www.onemap.gov.sg/', 'OneMap') + ', Singapore Land Authority, via ' + A('https://github.com/xkjyeah/singapore-postal-codes', 'singapore-postal-codes')],
  author: '', nav: null };
DMC.mountStamp(DAY);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COMPACT = matchMedia(DMC.COMPACT_Q);
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-SG');
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

/* ---------- light and dark ---------- */
// Dark is the page as designed: neon trades on a navy map. Light is a paper map with deeper inks,
// since the neon would vanish on it. The choice is remembered; ?theme=light or dark in a link wins.
const LOOK = {
  dark: { accent: '#FFC24B', bg: '#0B1426', meta: '#0B1220', dust: '#F2E3C8', dustA: [0.16, 0.24],
    cat: { shop: '#FFC24B', care: '#FF6FB5', health: '#4FE3C1', money: '#A6E86A', service: '#7FB2FF', night: '#C38CFF', motor: '#FF7A45', work: '#56C8FF' },
    pal: { bg: '#0B1426', water: '#050A16', green: '#0D1A2C', land: '#0D172A', building: '#121E35', aero: '#101B30', runway: '#1A2843',
      minor: '#15223A', major: '#1C2B48', casing: '#0B1426', motorway: '#27395E', rail: '#16223A' } },
  light: { accent: '#B97800', bg: '#EDEFF2', meta: '#EDEFF2', dust: '#3E4C63', dustA: [0.08, 0.13],
    cat: { shop: '#C27A00', care: '#C8317A', health: '#0B8F75', money: '#4C8A12', service: '#2B63C9', night: '#7B42CC', motor: '#D4480F', work: '#0A7DB3' },
    pal: { bg: '#EDEFF2', water: '#C9D5E3', green: '#E0E8DF', land: '#E7EAEE', building: '#DCE0E6', aero: '#E3E6EB', runway: '#D3D8E0',
      minor: '#FFFFFF', major: '#FFFFFF', casing: '#D6DBE3', motorway: '#FBFCFD', rail: '#D0D5DD' } },
};
const THEME_KEY = 'dmc-day04-theme';
let LIGHT = (() => {
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'light' || q === 'dark') return q === 'light';
  try { return localStorage.getItem(THEME_KEY) === 'light'; } catch { return false; }
})();
const look = () => LIGHT ? LOOK.light : LOOK.dark;
const colorOf = t => look().cat[t.cat];
function paintChrome() {
  const k = look(), root = document.documentElement;
  root.classList.toggle('light', LIGHT);
  root.style.setProperty('--day-accent', k.accent); root.style.setProperty('--day-accent-rgb', hexRgb(k.accent).join(', '));
  root.style.setProperty('--map-bg', k.bg);
  document.querySelector('meta[name="theme-color"]').content = k.meta;
}
paintChrome();
function setTheme(light) {
  LIGHT = light;
  try { localStorage.setItem(THEME_KEY, light ? 'light' : 'dark'); } catch { /* private mode: not remembered */ }
  const u = new URL(location.href);
  if (light) u.searchParams.set('theme', 'light'); else u.searchParams.delete('theme');
  history.replaceState(null, '', u);
  paintChrome();
  $('theme')?.setAttribute('aria-pressed', String(light));
  if (!map) return;
  paintBasemap();
  if (D) {
    for (const t of D.trades) t.color = colorOf(t);
    for (const b of $('rank').querySelectorAll('button')) b.style.setProperty('--k', BY_SSIC.get(b.dataset.ssic).color);
    if (T) paintTrade(T);
  }
  map.triggerRepaint();
}
// The sun / moon sits in the kit's button stack, above focus mode.
function addThemeButton() {
  const box = map.getContainer().querySelector('.dmc-ctrl');
  if (!box) return;
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'theme'; b.title = 'Light mode'; b.setAttribute('aria-label', 'Light mode');
  b.setAttribute('aria-pressed', String(LIGHT));
  b.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><g class="sun"><circle cx="10" cy="10" r="3.3"/>'
    + '<path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7 6 6M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3"/></g>'
    + '<path class="moon" d="M15.6 12.4A6 6 0 0 1 7.6 4.4a6 6 0 1 0 8 8z"/></svg>';
  b.addEventListener('click', () => setTheme(!LIGHT));
  box.insertBefore(b, box.lastElementChild);
}

/* ---------- basemaps: the page's own, or one of OneMap's ---------- */
// OneMap tiles go under everything the page draws. Picking one brings the look that suits it (light
// inks on the day maps, neon on Night and Satellite); the sun / moon can still change that.
const BASES = [   // [OneMap style or 'plain', label, look]
  ['plain', 'Plain', null], ['Default', 'OneMap', 'light'], ['Grey', 'OneMap Grey', 'light'], ['GreyLite', 'OneMap Grey Lite', 'light'],
  ['Original', 'OneMap Original', 'light'], ['Night', 'OneMap Night', 'dark'], ['Satellite', 'OneMap Satellite', 'dark'], ['LandLot', 'OneMap Land Lot', 'light'],
];
const BASE_PAINT = { Default: { 'raster-saturation': -0.3 }, Original: { 'raster-saturation': -0.3 }, Satellite: { 'raster-saturation': -0.2, 'raster-brightness-max': 0.8 } };
// OneMap's tiles stop at a rectangle; the map beyond takes the colour of each style's sea, so the
// edge doesn't show in the tilted view (Land Lot is see-through: it keeps the page's own ground).
const BASE_SEA = { Default: '#7FA8D4', Grey: '#D1D1D1', GreyLite: '#D4D4D4', Original: '#C6D6F0', Night: '#003753', Satellite: '#1D3A44' };
const groundColor = () => BASE_SEA[BASE] || look().pal.bg;
const BASE_KEY = 'dmc-day04-base';
const isBase = n => BASES.some(b => b[0] === n);
let BASE = (() => {
  const q = new URLSearchParams(location.search).get('base');
  if (isBase(q)) return q;
  try { const s = localStorage.getItem(BASE_KEY); if (isBase(s)) return s; } catch { /* not remembered */ }
  return 'plain';
})();
function addOneMap(name) {
  const b = DMC.BASEMAPS[name], layers = map.getStyle().layers;
  const before = (layers.find(l => l.type !== 'background') || {}).id;   // under every map and data layer

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.idxBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  },
  render(gl, matrix) {
    if (!CUR || !T) return;
    // camera matrix, moved to the origin in double precision so float32 positions stay exact
    const M = Float64Array.from(matrix);
    for (let r = 0; r < 4; r++) M[12 + r] += matrix[r] * O[0] + matrix[4 + r] * O[1];
    // short screens (phones on their side) get lower mountains
    const hm = HMAX * zScale() * Math.min(1, map.getCanvas().clientHeight / 760), uZ = hm * MERC_PER_M;
    this.M = M; this.uZ = uZ;
    const M32 = Float32Array.from(M);
    // our attributes go on the default vertex array, never on one of MapLibre's
    if (gl.bindVertexArray) gl.bindVertexArray(null); else if (this.vaoExt) this.vaoExt.bindVertexArrayOES(null);
    if (this.dirtySurf) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.aBuf); gl.bufferData(gl.ARRAY_BUFFER, CUR, gl.DYNAMIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.bBuf); gl.bufferData(gl.ARRAY_BUFFER, TGT, gl.DYNAMIC_DRAW);
      this.dirtySurf = false;
    }
    if (this.dirtyDots) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.dotBuf); gl.bufferData(gl.ARRAY_BUFFER, this.dots, gl.DYNAMIC_DRAW);
      this.nDots = this.dots.length / 7; this.dirtyDots = false;
    }
    const [r, g, b] = hexRgb(T.color).map(c => c / 255), on = [];
    const attr = (loc, buf, size, stride, off) => {
      if (loc === undefined || loc < 0) return;
      gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc); on.push(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, off);
    };
    // the land
    const S = this.surf.loc;
    gl.useProgram(this.surf.p);
    attr(S.aPos, this.posBuf, 2, 0, 0); attr(S.aA, this.aBuf, 3, 0, 0); attr(S.aB, this.bBuf, 3, 0, 0);
    gl.uniformMatrix4fv(S.uM, false, M32);
    gl.uniform1f(S.uMix, U); gl.uniform1f(S.uZ, uZ); gl.uniform1f(S.uS, hm / STEP);
    gl.uniform3f(S.uC, r, g, b); gl.uniform1f(S.uLight, LIGHT ? 1 : 0);
    gl.uniform1f(S.uLine, cLine + (tLine - cLine) * U); gl.uniform1f(S.uTop, Math.max(1e-4, cTop + (tTop - cTop) * U));
    gl.uniform1f(S.uFloor, 0.008);
    // close up the camera stands on a slope: the glass fades, the contour lines stay
    gl.uniform1f(S.uFill, Math.min(1, Math.max(0.12, (15.5 - map.getZoom()) / 2.5)));
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.idxBuf);
    gl.drawElements(gl.TRIANGLES, this.nIdx, this.u32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
    on.splice(0).forEach(l => gl.disableVertexAttribArray(l));
    // the dots, glow then core: added light on the dark map, ink on the light one
    if (this.nDots) {
      const D_ = this.dot.loc, st = 28, dpr = map.getPixelRatio(), cv = map.getCanvas();
      // dot pitch: about 7 m on the ground, never under 1.9 px, so a building's crowd reads as a blob from afar
      const mpp = 40075016.7 * Math.cos(1.3 * Math.PI / 180) / (512 * 2 ** map.getZoom());
      const pitch = Math.max(1.9, 7 / mpp), rad = Math.max(0.75, pitch * 0.42);
      gl.useProgram(this.dot.p);
      attr(D_.aBp, this.dotBuf, 2, st, 0); attr(D_.aO, this.dotBuf, 2, st, 8); attr(D_.aD, this.dotBuf, 1, st, 16); attr(D_.aHB, this.dotBuf, 2, st, 20);
      gl.uniformMatrix4fv(D_.uM, false, M32);
      gl.uniform1f(D_.uMix, U); gl.uniform1f(D_.uZ, uZ); gl.uniform1f(D_.uG, G); gl.uniform1f(D_.uPitch, pitch);
      gl.uniform2f(D_.uPx, 2 / cv.clientWidth, 2 / cv.clientHeight * Math.cos(map.getPitch() * Math.PI / 180));   // crowds lie flat
      gl.disable(gl.DEPTH_TEST);
      if (LIGHT) gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); else gl.blendFunc(gl.ONE, gl.ONE);
      for (const [scale, alpha, soft] of LIGHT ? [[3.2, 0.1, 0.0], [1, 0.95, 0.55]] : [[3.2, 0.07, 0.0], [1, 0.85, 0.55]]) {
        gl.uniform1f(D_.uSize, 2 * rad * scale * dpr); gl.uniform1f(D_.uSoft, soft);
        gl.uniform4f(D_.uCol, r * alpha, g * alpha, b * alpha, alpha);
        gl.drawArrays(gl.POINTS, 0, this.nDots);
      }
      on.splice(0).forEach(l => gl.disableVertexAttribArray(l));
    }
    placeSigns();
  },
};
// Zoomed out past the island (phones), mountains keep their height on screen. Zooming in they grow,
// but more slowly than the ground, and from zoom 13 they shrink, so a close-up never puts the camera
// inside one.
const zScale = () => { const z = map.getZoom(); return z <= 10.5 ? 2 ** (10.5 - z) : z <= 13 ? 2 ** (-(z - 10.5) * 0.5) : 2 ** (-1.25 - (z - 13) * 1.25); };

/* ---------- half area: the 150 m cells that hold half of the trade ---------- */
function halfCells(t) {
  const CELL = D.method.cell, KX = 111320 * Math.cos(1.35 * Math.PI / 180), KY = 110574, m = new Map();
  for (let b = 0; b < t.p.length; b += 2) {
    const q = t.p[b], ix = Math.floor(PX[q] * KX / CELL), iy = Math.floor(PY[q] * KY / CELL), k = ix * 100000 + iy;
    m.set(k, (m.get(k) || 0) + t.p[b + 1]);
  }
  const cells = [...m.entries()].sort((a, b) => b[1] - a[1]), feats = [];
  let acc = 0;
  for (const [k, c] of cells) {
    if (acc * 2 >= t.n) break;
    acc += c;
    const ix = Math.floor(k / 100000), iy = k - ix * 100000;
    const w = ix * CELL / KX, e = (ix + 1) * CELL / KX, s = iy * CELL / KY, nn = (iy + 1) * CELL / KY;
    feats.push({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[w, s], [e, s], [e, nn], [w, nn], [w, s]]] } });
  }
  return { type: 'FeatureCollection', features: feats };
}

/* ---------- map ---------- */
let map;
const styleP = fetch('https://tiles.openfreemap.org/styles/positron').then(r => r.json()).catch(() => null);
const dataP = DMC.loadData('data/day04/trades.js', 'DAY04').then(d => { decode(d); return d; });
styleP.then(base => {
  DAY.style = base ? paintStyle(base) : fallbackStyle();
  map = DMC.createMap(DAY);
  addThemeButton();
  addBaseButton();
  signBox = document.createElement('div'); signBox.className = 'signs';
  map.getCanvasContainer().append(signBox);
  Promise.all([dataP, new Promise(r => map.loaded() ? r() : map.on('load', r))]).then(([d]) => start(d)).catch(err => {
    $('name').textContent = 'The register could not be loaded.';
    $('say').textContent = String(err.message || err);
    console.error(err);
  });
});

function start(d) {
  D = d;
  // every business, as dust
  const dust = { type: 'FeatureCollection', features: [] };
  for (let i = 0; i < PN.length; i++) dust.features.push({ type: 'Feature', properties: { n: PN[i] }, geometry: { type: 'Point', coordinates: [PX[i], PY[i]] } });
  map.addSource('dust', { type: 'geojson', data: dust });
  map.addLayer({ id: 'dust', type: 'circle', source: 'dust', paint: {
    'circle-color': look().dust, 'circle-blur': 0.4,
    'circle-radius': ['interpolate', ['exponential', 1.6], ['zoom'], 9, ['min', 3, ['*', 0.28, ['sqrt', ['get', 'n']]]], 13, ['min', 10, ['*', 0.6, ['sqrt', ['get', 'n']]]], 17, ['*', 2.2, ['sqrt', ['get', 'n']]]],
    'circle-opacity': ['interpolate', ['linear'], ['zoom'], 9, look().dustA[0], 14, look().dustA[1]] } });
  map.addSource('half', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'half-fill', type: 'fill', source: 'half', paint: { 'fill-color': '#FFC24B', 'fill-opacity': 0.1 } });
  map.addLayer({ id: 'half-line', type: 'line', source: 'half', paint: { 'line-color': '#FFC24B', 'line-opacity': 0.45, 'line-width': 0.8 } });
  // the land: a finer grid where the GPU takes 32-bit indices (nearly all do)
  const cvs = map.getCanvas(), gl = cvs.getContext('webgl2') || cvs.getContext('webgl');
  gridSetup(gl && (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext || gl.getExtension('OES_element_index_uint')) ? 100 : 200);
  map.addLayer(peaks);

  showBase();
  buildList();
  const q = new URLSearchParams(location.search).get('trade');
  const first = D.trades.find(t => t.ssic === q) || D.trades[0];
  choose(first, { fly: false });
}

/* ---------- list, card, hotspots ---------- */
const xMax = () => Math.log(D.trades[0].x);
function buildList() {
  const ol = $('rank');
  for (const t of D.trades) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.dataset.ssic = t.ssic; b.setAttribute('aria-pressed', 'false');
    b.style.setProperty('--k', t.color);
    b.style.setProperty('--w', `${Math.max(3, Math.log(t.x) / xMax() * 100)}%`);
    b.innerHTML = `<span class="no">${t.rank}</span><span class="nm"></span><span class="x"><span class="bar"><i></i></span><b>${t.x}×</b></span>`;
    b.querySelector('.nm').textContent = t.name;
    b.addEventListener('click', () => { clearTimeout(hoverT); if (T !== t) choose(t); if (COMPACT.matches || innerWidth <= 900) setList(false); });
    // A mouse resting on a row picks it; the pause lets a sweep down the list pass without restarting every row.
    b.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse') return;
      clearTimeout(hoverT);
      hoverT = setTimeout(() => { if (T !== t) choose(t, { scroll: false }); }, 140);
    });
    b.addEventListener('pointerleave', () => clearTimeout(hoverT));
    li.append(b); ol.append(li);
  }
}
let hoverT;
const area = km2 => km2 < 1 ? `${fmt(Math.round(km2 * 100))} ha` : `${km2 < 10 ? km2.toFixed(1) : Math.round(km2)} km²`;
function choose(t, o = {}) {
  T = t;
  paintTrade(t);
  for (const b of $('rank').querySelectorAll('button')) {
    const on = b.dataset.ssic === t.ssic;
    b.setAttribute('aria-pressed', String(on));
    if (on && o.scroll !== false) b.scrollIntoView({ block: 'nearest' });
  }
  $('kick').textContent = `${D.cats[t.cat]} · no. ${t.rank} of ${D.trades.length}`;
  $('name').textContent = t.name;
  $('big').innerHTML = `${t.x}<small>×</small>`;
  const h = t.hot[0];
  $('say').innerHTML = `Half of Singapore's <b>${fmt(t.n)}</b> ${t.name.toLowerCase()} fit in <b>${area(t.half)}</b>; half of ${fmt(t.n)} businesses picked at random need <b>${area(t.exp)}</b>.`
    + (h ? ` The biggest huddle: <b>${fmt(h[3])}</b> around ${h[0]}.` : '');
  // two squares, area to scale
  const S = 66, s1 = S, s2 = Math.max(3, S * Math.sqrt(t.half / t.exp));
  $('sq').innerHTML = `<figure><span class="box" style="width:${s1}px;height:${s1}px"></span><figcaption><b>${area(t.exp)}</b>random mix</figcaption></figure>`
    + `<figure><span class="box t" style="width:${s2}px;height:${s2}px"></span><figcaption><b>${area(t.half)}</b>${t.name.toLowerCase()}<br>(squares on the map)</figcaption></figure>`;
  TGRID = gridOf(t);
  $('leg').innerHTML = `Height: how much of the trade stands within about half a kilometre, one scale for every trade. A line every <b>${t.lineD}</b> per hectare.`;
  const hots = $('hots');
  hots.replaceChildren();
  signs.forEach(s => s.el.remove()); signs = [];
  t.hot.forEach((hh, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.innerHTML = `<b>${fmt(hh[3])}</b><span></span>`; btn.querySelector('span').textContent = hh[0];
    btn.title = `Fly to ${hh[0]}`;
    btn.addEventListener('click', () => flyHot(hh));
    hots.append(btn);
    if (i >= (COMPACT.matches ? 3 : 4)) return;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'hs' + (i === 0 ? ' top' : '');
    el.innerHTML = '<span class="hs-box"><b></b><span></span></span><span class="hs-stem"></span>';
    el.querySelector('b').textContent = fmt(hh[3]); el.querySelector('.hs-box span').textContent = hh[0];
    el.setAttribute('aria-label', `${hh[3]} ${t.name.toLowerCase()} around ${hh[0]}: fly there`);
    el.addEventListener('click', () => flyHot(hh));
    signBox.append(el);
    signs.push({ el, lng: hh[1], lat: hh[2], h0: 0, h1: 0, w: 0, h: 0 });
  });
  map.getSource('half').setData(halfCells(t));
  setTradeDots(t);
  morphTo(TGRID, t.top, t.lineN, 2200);
  G = 0; animateTo(1, 2400);
  const u = new URL(location.href); u.searchParams.set('trade', t.ssic); history.replaceState(null, '', u);
  if (o.fly !== false && map.getZoom() > 12.5) DMC.frame(map);   // back out to the island from a close-up
}
let TGRID = null;   // the chosen trade's surface
// The trade's colour: the page's accents, and its half-area squares on the map.
function paintTrade(t) {
  const root = document.documentElement.style, c = t.color;
  root.setProperty('--c', c); root.setProperty('--c-rgb', hexRgb(c).join(', '));
  map.setPaintProperty('half-fill', 'fill-color', c); map.setPaintProperty('half-line', 'line-color', c);
}

// Summit signs ride the land: placed from the same matrix the layer draws with, every frame.
// A sign that would cover a busier one hides until the map zooms in far enough to part them.
let signBox, signs = [];
function placeSigns() {
  const L = peaks, M = L.M;
  if (!M) return;
  const cv = map.getCanvas(), W = cv.clientWidth, H = cv.clientHeight, shown = [];
  for (const s of signs) {
    const x = mercX(s.lng) - O[0], y = mercY(s.lat) - O[1], z = (s.h0 + (s.h1 - s.h0) * U) * L.uZ;
    const cx = M[0] * x + M[4] * y + M[8] * z + M[12], cy = M[1] * x + M[5] * y + M[9] * z + M[13], cw = M[3] * x + M[7] * y + M[11] * z + M[15];
    if (!s.w) { s.w = s.el.offsetWidth; s.h = s.el.offsetHeight; }
    const X = (cx / cw + 1) / 2 * W, Y = (1 - cy / cw) / 2 * H - 4;
    const r = { l: X - s.w / 2, r: X + s.w / 2, t: Y - s.h, b: Y };
    const hide = cw <= 0 || r.r < 0 || r.l > W || r.b < 0 || r.t > H
      || shown.some(q => r.l < q.r + 4 && r.r > q.l - 4 && r.t < q.b + 2 && r.b > q.t - 2);
    s.el.classList.toggle('hide', hide);
    if (hide) continue;
    shown.push(r);
    s.el.style.transform = `translate(${r.l.toFixed(1)}px, ${r.t.toFixed(1)}px)`;
  }
}
function flyHot(h) {
  map.flyTo({ center: [h[1], h[2]], zoom: 16, duration: REDUCED ? 0 : 1600, essential: true });
}
function step(d) {
  const i = D.trades.indexOf(T), j = Math.max(0, Math.min(D.trades.length - 1, i + d));
  if (j !== i) choose(D.trades[j]);
}
$('prev').addEventListener('click', () => D && step(-1));
$('next').addEventListener('click', () => D && step(1));
addEventListener('keydown', e => {
  // the map keeps its own arrow keys for panning
  if (!D || e.target.closest('input, textarea, .maplibregl-map') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' && e.target.closest('#rank')) { step(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' && e.target.closest('#rank')) { step(1); e.preventDefault(); }
});

// phones and narrow screens: the list is a sheet over the map
function setList(open) {
  $('list').classList.toggle('open', open);
  $('open-list').setAttribute('aria-expanded', String(open));
  if (open) $('rank').querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: 'center' });
}
$('open-list').addEventListener('click', () => setList(!$('list').classList.contains('open')));
$('list-close').addEventListener('click', () => setList(false));
new ResizeObserver(() => document.documentElement.style.setProperty('--card-h', `${$('card').offsetHeight}px`)).observe($('card'));
</script>
</body>
</html>
