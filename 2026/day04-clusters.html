<!DOCTYPE html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<title>Day 04 · Where the Cabs Gather</title>
<meta name="description" content="#30DayMapChallenge 2026, day 4, Clusters: DBSCAN on every free taxi in Singapore, 6 pm against 2 am, as glowing prisms on a swipe map, with a live clustering playground.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="kit/dmc.css">
<style>
/* ===== Day 04: two synchronised maps, a swipe divider, DBSCAN prisms ===== */
:root { --pm: #FF8A4C; --pm-rgb: 255, 138, 76; --am: #4FE3FF; --am-rgb: 79, 227, 255; --split: 50vw; }
#map-pm { z-index: 0; }
#map { z-index: 1; clip-path: inset(0 0 0 var(--split)); }
#dmc-stamp, .lab, .strip { z-index: 4; }   /* panels sit above the divider */
.dusk { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(180deg, rgba(255, 140, 90, .22) 0%, rgba(255, 200, 150, .04) 40%, rgba(80, 70, 130, .14) 100%); mix-blend-mode: multiply; }

/* divider: the line stays in focus mode (it is part of the map); the knob is chrome */
.divider { position: fixed; z-index: 3; top: 0; bottom: 0; left: var(--split); width: 28px; margin-left: -14px; cursor: ew-resize; touch-action: none; }
.divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 13px; width: 2px; background: linear-gradient(180deg, rgba(var(--pm-rgb), .0), rgba(255, 255, 255, .95) 12%, rgba(255, 255, 255, .95) 88%, rgba(var(--am-rgb), 0)); box-shadow: 0 0 10px rgba(255, 255, 255, .45), 0 0 1px rgba(0, 0, 0, .6); }
.divider:focus-visible { outline: none; }
.divider:focus-visible .knob { outline: 2px solid var(--day-accent); outline-offset: 3px; }
.knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%;
  background: conic-gradient(from 180deg, var(--pm) 0 50%, var(--am) 50% 100%); box-shadow: 0 0 0 3px rgba(11, 18, 32, .85), 0 0 22px rgba(255, 255, 255, .35); }
.knob svg { width: 22px; height: 22px; fill: none; stroke: #0B1220; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* side tags ride the divider */
.tag { position: fixed; z-index: 3; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); display: grid; gap: 2px; padding: 7px 11px 7px; pointer-events: none; min-width: 0; }
.tag.pm { right: calc(100vw - var(--split) + 14px); text-align: right; }
.tag.am { left: calc(var(--split) + 14px); }
.tag .hr { display: flex; align-items: baseline; gap: 7px; font-family: var(--display); font-size: 25px; font-weight: 800; line-height: .95; letter-spacing: .01em; }
.tag.pm .hr { flex-direction: row-reverse; color: #FFD2B4; text-shadow: 0 0 16px rgba(var(--pm-rgb), .6); }
.tag.am .hr { color: #C9F6FF; text-shadow: 0 0 16px rgba(var(--am-rgb), .6); }
.tag .hr small { font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--text-2); text-shadow: none; }
.tag .st { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag .st b { color: var(--text); font-weight: 600; }

/* cluster labels (MapLibre markers, lifted to the prism tops) */
.cl { pointer-events: none; }
.cl-in { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); display: grid; justify-items: center; transition: opacity .2s; }
.cl.hide .cl-in { opacity: 0; }
.cl-box { display: flex; align-items: baseline; gap: 5px; padding: 3px 8px 3px 7px; border-radius: 999px; white-space: nowrap; font-size: 11px; font-weight: 600; color: #fff;
  background: rgba(9, 14, 24, .82); border: 1px solid rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.cl-box b { font-family: var(--display); font-size: 14px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cl.pm .cl-box b { color: #FFB38A; }
.cl.am .cl-box b { color: var(--am); }
.cl-stem { width: 1.5px; height: 12px; background: linear-gradient(rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)); }

/* playground */
.lab { top: calc(var(--gutter) + env(safe-area-inset-top, 0px) + 184px); right: calc(var(--gutter) + env(safe-area-inset-right, 0px)); width: 264px; padding: 10px 12px 11px; display: grid; gap: 9px; }
.lab-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lab-h h2 { font-family: var(--display); font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.lab-toggle { display: none; }
.lab-reset { font: inherit; font-size: 10.5px; font-weight: 600; color: var(--text-2); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; min-height: 22px; cursor: pointer; }
.lab-reset:hover { color: var(--text); }
.lab-reset[disabled] { opacity: .35; cursor: default; }
.lab-body { display: grid; gap: 9px; }
.knobrow { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: center; }
.knobrow label { font-size: 11px; color: var(--text-2); }
.knobrow label b { color: var(--text); font-weight: 600; }
.knobrow output { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.knobrow input { grid-column: 1 / -1; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--day-accent) var(--p, 50%), rgba(255, 255, 255, .16) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--day-accent) var(--p, 50%), rgba(255, 255, 255, .16) var(--p, 50%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 3px rgba(var(--day-accent-rgb), .35); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 3px rgba(var(--day-accent-rgb), .35); }

.hours-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--text-2); }
.hours-h b { color: var(--text); font-weight: 600; }
.hours { position: relative; height: 46px; margin-top: 2px; touch-action: none; cursor: pointer; }
.hours svg { position: absolute; inset: 0 0 12px; width: 100%; height: calc(100% - 12px); overflow: visible; }
.hours .bar { fill: rgba(255, 255, 255, .14); }
.hours .bin { fill: rgba(255, 255, 255, .5); }
.hours .bar.pm { fill: rgba(var(--pm-rgb), .35); } .hours .bin.pm { fill: var(--pm); }
.hours .bar.am { fill: rgba(var(--am-rgb), .3); } .hours .bin.am { fill: var(--am); }
.hours .night { fill: rgba(120, 140, 255, .07); }
.thumb { position: absolute; bottom: 0; width: 22px; height: 22px; margin-left: -11px; padding: 0; border: 0; background: none; cursor: grab; }
.thumb::before { content: ""; position: absolute; left: 50%; bottom: 3px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 0 2px rgba(11, 18, 32, .9); }
.thumb.pm::before { background: var(--pm); } .thumb.am::before { background: var(--am); }
.thumb::after { content: ""; position: absolute; inset: -10px -4px -6px; }
.thumb:focus-visible { outline: none; }
.thumb:focus-visible::before { box-shadow: 0 0 0 2px #fff; }
.hours-ax { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-2); margin-top: -2px; font-variant-numeric: tabular-nums; }

.nights { display: flex; align-items: center; gap: 6px; }
.nights > span { font-size: 11px; color: var(--text-2); }
.nights .dmc-seg { flex: 1; justify-content: space-between; }
.nights .dmc-seg button { flex: 1; padding: 3px 0; min-height: 24px; font-size: 11px; }
.why { font-size: 11px; line-height: 1.45; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 8px; }
.why b { color: var(--text); font-weight: 600; }

/* comparison strip */
.strip { left: 50%; transform: translateX(-50%); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); width: min(880px, calc(100vw - 2 * var(--gutter))); padding: 9px 12px 8px; display: grid; gap: 7px; }
.strip-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.strip-h h2 { font-size: 12px; font-weight: 600; }
.strip-h h2 i { font-style: normal; color: var(--text-2); font-weight: 500; }
.strip-h p { font-size: 10.5px; color: var(--text-2); white-space: nowrap; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.rank li { min-width: 0; }
.rank button { width: 100%; display: grid; gap: 3px; text-align: left; padding: 6px 8px 7px; font: inherit; color: var(--text); background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .08); border-radius: 9px; cursor: pointer; }
.rank button:hover { background: rgba(255, 255, 255, .09); }
.rank .nm { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .nm em { font-style: normal; color: var(--text-2); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
.rank .vals { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
.rank .vals b { font-family: var(--display); font-size: 19px; font-weight: 800; line-height: 1; }
.rank .vals .p { color: #FFB38A; } .rank .vals .a { color: var(--am); }
.rank .vals i { font-style: normal; font-size: 11px; color: var(--text-2); }
.rank .bars { display: grid; gap: 2px; }
.rank .bars span { display: block; height: 3px; border-radius: 2px; min-width: 2px; }
.rank .bars .p { background: var(--pm); box-shadow: 0 0 6px rgba(var(--pm-rgb), .6); }
.rank .bars .a { background: var(--am); box-shadow: 0 0 6px rgba(var(--am-rgb), .6); }
.rank .wk { font-size: 10px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .dmc-credits { font-size: 9.5px; }

/* ---- compact screens ---- */
@media (max-width: 640px), (max-height: 520px) {
  .tag { padding: 5px 8px; }
  .tag .hr { font-size: 20px; }
  .tag .hr small { font-size: 10px; }
  .tag .st { font-size: 10px; }
  .rank { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 1px; }
  .rank::-webkit-scrollbar { display: none; }
  .rank li { flex: 0 0 132px; scroll-snap-align: start; }
  .lab { top: auto; right: auto; left: calc(var(--gutter) + env(safe-area-inset-left, 0px)); width: min(264px, calc(100vw - 2 * var(--gutter))); padding: 7px 10px; gap: 8px; }
  .lab-toggle { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 11px; font-weight: 600; color: var(--text); background: none; border: 0; padding: 4px 0; min-height: 28px; cursor: pointer; }
  .lab-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s; }
  .lab[aria-expanded="true"] .lab-toggle svg { transform: rotate(180deg); }
  .lab-h h2 { display: none; }
  .lab:not([aria-expanded="true"]) { width: auto; }
  .lab:not([aria-expanded="true"]) .lab-body, .lab:not([aria-expanded="true"]) .lab-reset { display: none; }
}
@media (max-width: 640px) and (orientation: portrait) {
  .strip { left: 0; right: 0; transform: none; width: auto; bottom: 0; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .strip-h p { display: none; }
  .tag { top: auto; bottom: calc(var(--strip-h, 150px) + 10px); }
  .lab { bottom: calc(var(--strip-h, 150px) + 66px); }
  .knob { width: 36px; height: 36px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .strip { left: auto; right: calc(var(--gutter) + 48px); transform: none; width: min(420px, 50vw); }
  .rank li { flex-basis: 120px; }
  .lab { top: auto; bottom: var(--gutter); }
  .tag { top: calc(var(--gutter) + 82px); }   /* clear of the stamp */
  .strip-h p, .strip .dmc-credits { display: none; }
}
</style>
</head>
<body>
<div id="map-pm" class="dmc-map" role="region" aria-label="Left map: free taxis and their DBSCAN clusters in the evening"></div>
<div id="map" class="dmc-map" role="region" aria-label="Right map: free taxis and their DBSCAN clusters in the small hours"></div>

<div id="divider" class="divider" role="slider" tabindex="0" aria-label="Swipe between the evening map (left) and the night map (right)" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="Divider at 50 percent">
  <div class="knob dmc-chrome"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div>
</div>
<div id="tag-pm" class="tag pm dmc-glass dmc-chrome" aria-live="polite"><div class="hr"><span id="pm-hr">6 PM</span><small id="pm-day"></small></div><div class="st" id="pm-st">&nbsp;</div></div>
<div id="tag-am" class="tag am dmc-glass dmc-chrome" aria-live="polite"><div class="hr"><span id="am-hr">2 AM</span><small id="am-day"></small></div><div class="st" id="am-st">&nbsp;</div></div>

<header id="dmc-stamp" class="dmc-glass dmc-stamp" data-dmc-overlay></header>

<section id="lab" class="dmc-glass lab" data-dmc-overlay aria-label="DBSCAN playground" aria-expanded="true">
  <div class="lab-h">
    <h2>DBSCAN playground</h2>
    <button id="lab-toggle" class="lab-toggle" type="button" aria-controls="lab-body" aria-expanded="false">DBSCAN · <span id="lab-sum">200 m · 8</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
    <button id="reset" class="lab-reset" type="button" disabled>Reset</button>
  </div>
  <div id="lab-body" class="lab-body">
    <div class="knobrow">
      <label for="eps"><b>eps</b> · search radius</label><output id="eps-o" for="eps">200 m</output>
      <input id="eps" type="range" min="60" max="600" step="10" value="200">
    </div>
    <div class="knobrow">
      <label for="minpts"><b>minPts</b> · cabs to make a crowd</label><output id="minpts-o" for="minpts">8</output>
      <input id="minpts" type="range" min="3" max="30" step="1" value="8">
    </div>
    <div>
      <div class="hours-h"><span>Hour by hour, <b>Wed 28 Oct</b></span><span id="hours-note">bars: free · clustered</span></div>
      <div id="hours" class="hours">
        <svg id="hbars" aria-hidden="true"></svg>
        <button id="th-pm" class="thumb pm" type="button" role="slider" aria-label="Hour shown on the left map" aria-valuemin="0" aria-valuemax="23" aria-valuenow="18"></button>
        <button id="th-am" class="thumb am" type="button" role="slider" aria-label="Hour shown on the right map" aria-valuemin="0" aria-valuemax="23" aria-valuenow="2"></button>
      </div>
      <div class="hours-ax" aria-hidden="true"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div>
    </div>
    <div class="nights"><span>Night</span><div id="nights" class="dmc-seg" role="group" aria-label="Which weeknight: 6 pm that evening against 2 am after"></div></div>
    <p class="why" id="why">A cab is <b>core</b> when at least <b>minPts</b> free cabs (itself included) sit within <b>eps</b> of it; cores chain into clusters.</p>
  </div>
</section>

<section id="strip" class="dmc-glass strip" data-dmc-overlay aria-label="Where taxis gather, left map against right map">
  <div class="strip-h"><h2 id="strip-t">Biggest taxi crowds <i>6 pm → 2 am</i></h2><p id="strip-n">tap a place to fly there</p></div>
  <ol id="rank" class="rank"></ol>
  <p id="credits" class="dmc-credits"></p>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="kit/dmc.js"></script>
<script>
'use strict';
const DAY = { n: 4, title: 'Where the cabs gather: 6 pm against 2 am',
  deck: 'Every free taxi in Singapore, run through DBSCAN (200 m, 8 cabs) and stood up as prisms as tall as the crowd. Left is a weekday evening at 6, right is 2 am that night: drag the divider to swipe between them. The airport holds its queue all night while the city centre empties; the playground re-runs the clustering live in your browser.',
  accent: '#FF8A4C', basemapBg: '#0B1426',
  styleCredit: 'Basemap: <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a>, <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener noreferrer">&copy; OpenMapTiles</a>, &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors',
  camera: { pitch: 50, bearing: 20, tiltPitch: 50 },
  bounds: [[103.69, 1.255], [104.0, 1.425]], maxBounds: [[102.6, 0.5], [105.0, 2.2]], minZoom: 8,   /* the cab belt: Jurong East to Changi */
  buildings: false, creditsEl: 'credits',
  attribution: ['Taxis: <a href="https://data.gov.sg/datasets?query=taxi%20availability" target="_blank" rel="noopener noreferrer">LTA taxi availability via data.gov.sg</a>, Singapore Open Data Licence',
    'Place names: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors via <a href="https://photon.komoot.io/" target="_blank" rel="noopener noreferrer">Photon</a>'],
  author: '', nav: null };
DMC.mountStamp(DAY);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COMPACT = matchMedia(DMC.COMPACT_Q);
const $ = id => document.getElementById(id);

/* ---------- maps: right = kit map (2 am, night), left = evening map (dusk) ----------
   One OpenFreeMap vector style (positron, labels dropped) painted twice: a warm dusk palette
   and a navy night palette, so both sides show exactly the same streets. */
const PALETTE = {
  dusk: { bg: '#EFE4D9', water: '#AFBDD3', green: '#DFD9C4', land: '#EADDD0', building: '#E2D0C0', aero: '#F5E8DC', runway: '#FFF6EE',
    minor: '#F9EBDF', major: '#FFF7EF', casing: '#DDC1AA', motorway: '#FFDDBF', rail: '#D7C0AD' },
  night: { bg: '#0B1426', water: '#040915', green: '#0D1A2D', land: '#0D172A', building: '#14213A', aero: '#101C32', runway: '#1D2C49',
    minor: '#17243D', major: '#1F2F4D', casing: '#0B1426', motorway: '#2C4068', rail: '#17233B' },
};
function roleOf(l) {
  const id = l.id;
  if (l.type === 'symbol' || /boundary|ice_shelf|glacier|dashline|tunnel/.test(id) || l.source === 'ne2_shaded') return null;
  if (l.type === 'background' || /pier/.test(id)) return 'bg';
  if (/^water(way)?$/.test(id)) return 'water';
  if (/park|wood/.test(id)) return 'green';
  if (/landuse/.test(id)) return 'land';
  if (id === 'building') return 'building';
  if (id === 'aeroway-area') return 'aero';
  if (/aeroway/.test(id)) return 'runway';
  if (/rail/.test(id)) return 'rail';
  if (/casing/.test(id)) return 'casing';
  if (/motorway/.test(id)) return 'motorway';
  if (/major/.test(id)) return 'major';
  return 'minor';
}
function paintStyle(base, pal) {
  const st = JSON.parse(JSON.stringify(base));
  delete st.sources.ne2_shaded;
  st.layers = st.layers.filter(l => roleOf(l)).map(l => {
    const c = pal[roleOf(l)], p = l.paint || (l.paint = {});
    if (l.type === 'background') p['background-color'] = c;
    else if (l.type === 'fill') { p['fill-color'] = c; delete p['fill-pattern']; if ('fill-outline-color' in p) p['fill-outline-color'] = c; }
    else if (l.type === 'line') p['line-color'] = c;
    return l;
  });
  return st;
}
const FALLBACK = { version: 8, sources: {}, layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#0B1426' } }] };
let mapAm, mapPm;
const ready = {};
function initMaps(base) {
  DAY.style = base ? paintStyle(base, PALETTE.night) : FALLBACK;
  mapAm = DMC.createMap(DAY);
  mapPm = new maplibregl.Map({
    container: 'map-pm', style: base ? paintStyle(base, PALETTE.dusk) : FALLBACK,
    center: mapAm.getCenter(), zoom: mapAm.getZoom(), pitch: mapAm.getPitch(), bearing: mapAm.getBearing(),
    minZoom: mapAm.getMinZoom(), maxZoom: mapAm.getMaxZoom(), maxPitch: 78, maxBounds: mapAm.getMaxBounds(),
    attributionControl: false, dragRotate: true, pitchWithRotate: true, touchPitch: true,
  });
  { // a warm dusk wash over the evening basemap, under the markers
    const wash = document.createElement('div'); wash.className = 'dusk';
    mapPm.getCanvas().after(wash);
  }
  let syncing = false;
  const link = (a, b) => a.on('move', () => {
    if (syncing) return;
    syncing = true;
    b.jumpTo({ center: a.getCenter(), zoom: a.getZoom(), bearing: a.getBearing(), pitch: a.getPitch(), padding: a.getPadding() });
    syncing = false;
  });
  link(mapAm, mapPm); link(mapPm, mapAm);
  mapPm.jumpTo({ center: mapAm.getCenter(), zoom: mapAm.getZoom(), bearing: mapAm.getBearing(), pitch: mapAm.getPitch() });
  addEventListener('resize', () => mapPm.resize());
  mapAm.on('move', queuePlace);
  ready.pm = new Promise(r => mapPm.on('load', r));
  ready.am = new Promise(r => mapAm.on('load', r));
}

// Once, on arrival: sweep the divider right and back, so the evening side shows the airport too.

// DBSCAN on SVY21 metres with a uniform grid index (cell = eps): only the 3 x 3 cells around a

    }

      if (lab[j] !== -2) continue;

}

/* ---------- labels on the prism tops ---------- */
const labels = { pm: [], am: [] };
function lift(map, lngLat, h) {

  }

    el.className = `cl ${side}`;

    el.querySelector('span').textContent = c.name;

}

/* ---------- comparison strip ---------- */

  $('lab-sum').textContent = `${S.eps} m · ${S.minPts}`;
  paintRange(eps); paintRange(minpts);
  $('reset').disabled = S.eps === 200 && S.minPts === 8;
  clearTimeout(paramTimer); paramTimer = setTimeout(render, 30);
}
eps.addEventListener('input', onParams); minpts.addEventListener('input', onParams);
$('reset').addEventListener('click', () => { eps.value = 200; minpts.value = 8; onParams(); });
paintRange(eps); paintRange(minpts);

// phones: the playground folds to one line
const labEl = $('lab'), labToggle = $('lab-toggle');
function setLab(open) { labEl.setAttribute('aria-expanded', String(open)); labToggle.setAttribute('aria-expanded', String(open)); }
labToggle.addEventListener('click', () => setLab(labEl.getAttribute('aria-expanded') !== 'true'));
const syncLab = () => setLab(!COMPACT.matches);
COMPACT.addEventListener('change', syncLab); syncLab();

/* ---------- load ---------- */
// the maps start as soon as the style arrives; the taxis follow
const mapsP = fetch('https://tiles.openfreemap.org/styles/positron').then(r => r.json()).catch(() => null).then(initMaps);
Promise.all([fetch('data/day04/taxis.json').then(r => r.json()), mapsP]).then(async ([data]) => {
  D = data;
  const g = D.geo;
  toLL = (x, y) => {
    const u = (x - g.x0) / g.s, v = (y - g.y0) / g.s, L = g.lon, A = g.lat;
    return [+(L[0] + L[1] * u + L[2] * v + L[3] * u * u + L[4] * u * v + L[5] * v * v).toFixed(6),
      +(A[0] + A[1] * u + A[2] * v + A[3] * u * u + A[4] * u * v + A[5] * v * v).toFixed(6)];
  };
  D.groupsRe = D.groups.map(([p, gname]) => [new RegExp(p), gname]);
  const seg = $('nights');
  D.pairs.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.i = i; b.textContent = p.label;
    b.title = `6 pm ${dayLabel(p.pm)} against 2 am ${dayLabel(p.am)}`;
    b.addEventListener('click', () => { S.pair = i; S.hourly = false; S.hPm = 18; S.hAm = 2; render(); });
    seg.append(b);
  });
  $('why').innerHTML = `A cab is <b>core</b> when at least <b>minPts</b> free cabs (itself included) sit within <b>eps</b>; cores chain into clusters, the rest is noise. <b>${D.params.eps} m</b> is one airport kerb or a mall frontage: only ${Math.round(D.params.pct200 * 100)}% of cabs have 7 others that close, so what survives is a real crowd. <b>${D.params.minPts}</b> beats the few parked at any HDB carpark.`;
  await Promise.all([ready.pm, ready.am]);
  addLayers(mapPm, 'pm'); addLayers(mapAm, 'am');
  render();
  if (!REDUCED && !new URLSearchParams(location.search).has('view')) teaser();
}).catch(err => {
  console.error(err);
  $('strip-t').textContent = 'Could not load the taxi snapshots.';
});
setSplit(0.5);
</script>
