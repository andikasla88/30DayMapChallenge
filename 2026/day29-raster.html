<style>
/* ===== Day 29: a full-bleed thermal raster, a heat-relief toggle and a hot-vs-cool tour ===== */
:root {
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --hot: #FFADAD; --hot-rgb: 255, 173, 173;
  --cool: #9EB0FF; --cool-rgb: 158, 176, 255;
  --glass: rgba(10, 12, 17, .82);
  --panel-w: 344px;
}
.dmc-map { background: #0A0D12; }

/* ---- the panel: tour card, distribution strip, filter ---- */
.hp { bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
  width: var(--panel-w); max-height: calc(100% - 2 * var(--gutter) - var(--stamp-h, 96px) - 8px); overflow-y: auto; overscroll-behavior: contain;
  padding: 11px 13px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; scrollbar-width: thin; overflow-x: hidden; }
.hp-top { display: flex; align-items: center; gap: 8px; }
.kick { flex: 1; margin: 0; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); display: flex; gap: 8px; min-width: 0; }
.kick b { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kick b.hot { color: var(--hot); } .kick b.cool { color: var(--cool); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); cursor: pointer; padding: 0; }
.stepper button:hover { background: rgba(255, 255, 255, .14); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper button::after { content: ""; position: absolute; inset: -8px -3px; }
.stepper svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stepper .count { font-family: var(--mono); font-size: 10.5px; color: var(--text-2); min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 3px; }
.dots button { position: relative; width: 14px; height: 18px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.dots button::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: rgba(255, 255, 255, .25); transition: background .25s, transform .25s; }
.dots button.hot::before { background: rgba(var(--hot-rgb), .4); } .dots button.cool::before { background: rgba(var(--cool-rgb), .4); }
.dots button[aria-current="step"]::before { transform: scale(1.45); background: var(--text); }
.dots button.hot[aria-current="step"]::before { background: var(--hot); box-shadow: 0 0 8px rgba(var(--hot-rgb), .8); }
.dots button.cool[aria-current="step"]::before { background: var(--cool); box-shadow: 0 0 8px rgba(var(--cool-rgb), .8); }

.card { display: grid; gap: 6px; }
.card h2 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.25; letter-spacing: -.005em; text-wrap: balance; }
.card p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--text-2); }
.card p b { color: var(--text); font-weight: 600; }
.hero { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.hero b { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero b small { font-size: 15px; font-weight: 500; letter-spacing: 0; margin-left: 1px; }
.hero.hot b { color: var(--hot); text-shadow: 0 0 18px rgba(var(--hot-rgb), .45); }
.hero.cool b { color: var(--cool); text-shadow: 0 0 18px rgba(var(--cool-rgb), .45); }
.hero span { font-size: 11.5px; line-height: 1.3; color: var(--text-2); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; background: rgba(255, 255, 255, .045); font-size: 11px; color: var(--text-2); }
.vs div { display: grid; gap: 1px; }
.vs div:last-child { text-align: right; }
.vs b { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vs .h b { color: var(--hot); } .vs .c b { color: var(--cool); }
.vs i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--text); padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.top10 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 0; }
.top10 button { width: 100%; display: grid; grid-template-columns: 17px 1fr auto; align-items: baseline; gap: 5px; padding: 2px 4px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; font-size: 11px; text-align: left; cursor: pointer; }
.top10 button:hover { background: rgba(255, 255, 255, .07); }
.top10 .n { font-family: var(--mono); font-size: 10px; color: var(--hot); }
.top10 .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.top10 .t { font-family: var(--mono); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 10.5px !important; color: var(--text-2); opacity: .9; }

/* ---- distribution strip: the legend, the zones and the filter ---- */
.dist { display: grid; gap: 3px; padding-top: 8px; border-top: 1px solid var(--line); }
.dist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 10.5px; color: var(--text-2); }
.dist-head b { font-family: var(--mono); font-weight: 500; color: var(--text); }
.dist-head .nd { display: inline-block; width: 8px; height: 8px; margin: 0 1px 0 6px; vertical-align: -1px; border-radius: 2px; background: rgb(44, 48, 56); box-shadow: 0 0 0 1px rgba(255, 255, 255, .25); }
#d-hover { white-space: nowrap; }
#dist svg { display: block; width: 100%; height: auto; overflow: visible; }
#dist .lab { font: 500 9.5px var(--mono); fill: var(--text-2); }
#dist .lab.on { fill: var(--text); font-weight: 600; }
#dist .tick { font: 400 9.5px var(--mono); fill: rgba(238, 242, 247, .55); }
.filter { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 5px 8px; }
.filter .dmc-seg { grid-column: 1 / -1; justify-self: start; }
.filter label { font-family: var(--mono); font-size: 11px; color: var(--text); min-width: 46px; font-variant-numeric: tabular-nums; }
.filter .dmc-seg button { padding: 3px 8px; min-height: 24px; font-size: 11px; }
.filter input[type=range] { width: 100%; margin: 0; accent-color: var(--day-accent); }
.filter input[type=range]:disabled { opacity: .35; }
.filter output { grid-column: 1 / -1; font-size: 11px; color: var(--text-2); min-height: 1.4em; }
.filter output b { font-family: var(--mono); font-weight: 500; color: var(--text); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .dmc-btn { font-size: 11.5px; padding: 4px 10px; min-height: 28px; }
.row .dmc-btn[aria-pressed="true"] { color: #1A0E0C; background: var(--day-accent); border-color: transparent; }
.src summary { cursor: pointer; font-size: 11px; color: var(--text-2); list-style: none; }
.src summary::-webkit-details-marker { display: none; }
.src summary::before { content: "+ "; font-family: var(--mono); }
.src[open] summary::before { content: "\2212  "; }
.src .dmc-note { margin-top: 5px; font-size: 11px; }
.src .dmc-credits { margin-top: 5px; }

/* ---- hover read-out ---- */
.tip { position: fixed; z-index: 5; left: 0; top: 0; pointer-events: none; padding: 7px 10px 8px; min-width: 150px; max-width: 230px;
  background: rgba(10, 12, 17, .92); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); display: grid; gap: 3px; }
.tip[hidden] { display: none; }
.tip .t { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 19px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tip .t i { width: 11px; height: 11px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .3); }
.tip .s { font-size: 11px; line-height: 1.35; color: var(--text-2); }
.tip .s b { color: var(--text); font-weight: 600; }

/* ---- pins: the ten hottest roof clusters, reservoir names ---- */
.pin { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  font: 600 10px var(--mono); color: #1A0E0C; background: var(--hot); box-shadow: 0 0 0 2px rgba(10, 12, 17, .85), 0 0 12px rgba(var(--hot-rgb), .8); }
.pin::after { content: ""; position: absolute; inset: -8px; }
.pin.on { background: #fff; box-shadow: 0 0 0 2px rgba(10, 12, 17, .85), 0 0 0 4px var(--hot), 0 0 18px rgba(var(--hot-rgb), .9); }
.rlab { pointer-events: none; font: italic 500 10.5px var(--font); color: var(--cool); text-shadow: 0 0 3px #0A0D12, 0 0 6px #0A0D12, 0 1px 2px #000; white-space: nowrap; }
.rlab span { opacity: 0; transition: opacity .4s; }
.show-rlab .rlab span { opacity: 1; }
.rlab b { font-family: var(--mono); font-style: normal; font-weight: 600; }
.loading { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.loading[hidden] { display: none; }

/* ---- compact screens ---- */
@media (max-width: 640px), (max-height: 520px) {
  .hero b { font-size: 25px; }
  .card h2 { font-size: 13.5px; }
  .card p { font-size: 11.5px; }
}
/* Phones held upright: the panel becomes a bottom sheet. */
@media (max-width: 640px) and (orientation: portrait) {
  .hp { left: 0; right: 0; bottom: 0; width: auto; max-height: 44vh; border-bottom: 0; border-radius: 16px 16px 0 0;
    padding: 9px 12px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 7px; }
  .dots { display: none; }
  .card p.more { display: none; }
  .top10 { grid-template-columns: 1fr 1fr; gap: 0 6px; }
  .pin { width: 17px; height: 17px; font-size: 9px; }
}
/* Phones held sideways: a right-hand column. */
@media (max-height: 520px) and (orientation: landscape) {
  .hp { left: auto; right: calc(var(--gutter) + 48px + env(safe-area-inset-right, 0px)); width: min(320px, 46vw); max-height: calc(100% - 2 * var(--gutter)); padding: 9px 11px 8px; gap: 7px; }
  .dots { display: none; }
  .card p.more { display: none; }
}
</style>

<body>
<div id="map" class="dmc-map" role="region" aria-label="Map of Singapore coloured by ground temperature from Landsat: blue is cooler than the island's middle, red is hotter. Hover or tap for the temperature."></div>
<div id="tip" class="tip dmc-chrome" hidden></div>
<p id="loading" class="loading dmc-chrome">Developing the thermal picture&hellip;</p>

<header id="dmc-stamp" class="dmc-glass dmc-stamp" data-dmc-overlay></header>

<section id="panel" class="dmc-glass hp" data-dmc-overlay aria-label="Hottest versus coolest: a tour">
  <div class="hp-top">
    <p class="kick"><span id="k-n">01</span><b id="k-label">The island</b></p>
    <div class="stepper">
      <div id="dots" class="dots"></div>
      <button id="prev" type="button" aria-label="Previous stop"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="next" type="button" aria-label="Next stop"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </div>
  <div id="card" class="card" aria-live="polite"></div>

  <div class="dist">
    <div class="dist-head"><span>All land, by temperature <i class="nd" aria-hidden="true"></i> no reading</span><span id="d-hover">hover or tap the map</span></div>
    <div id="dist"></div>
    <div class="filter">
      <div class="dmc-seg" role="group" aria-label="Filter the map">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="hot" aria-pressed="false">Hotter than</button>
        <button type="button" data-f="cool" aria-pressed="false">Cooler than</button>
      </div>
      <label for="thr" id="thr-v">45.0°</label>
      <input id="thr" type="range" min="24" max="54" step="0.5" value="45" aria-label="Filter temperature, degrees Celsius" disabled>
      <output id="thr-out" for="thr"></output>
    </div>
  </div>
  <div class="row">
    <button id="relief" class="dmc-btn" type="button" aria-pressed="false">Heat relief</button>
    <span class="note" id="relief-note">Raise the ground by its temperature.</span>
  </div>
  <details class="src">
    <summary>Method and sources</summary>
    <p class="dmc-note" id="method"></p>
    <p id="credits" class="dmc-credits"></p>
  </details>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="kit/dmc.js"></script>
<script>
'use strict';
const A = (href, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`;
const DAY = {
  n: 29,
  title: 'Hot roofs, cool reservoirs: how hot Singapore\'s ground gets at 11 a.m.',
  deck: 'Seven clear Landsat passes, each at about 11:16 a.m., blended into one cloud-free picture of the ground\'s temperature. Blue is cooler than the island\'s middle and red is hotter. This is the heat of surfaces, roofs, roads, leaves and water, not the air you feel.',
  accent: '#FFADAD',
  basemap: 'esri-imagery',
  basemapPaint: { 'raster-saturation': -1, 'raster-contrast': .05, 'raster-brightness-max': .85, 'raster-opacity': ['interpolate', ['linear'], ['zoom'], 12.6, 0, 15, .9] },
  basemapBg: '#0A0D12',
  bounds: [[103.6, 1.205], [104.09, 1.472]],
  minZoom: 9, maxZoom: 17.5,
  camera: { pitch: 0, bearing: 0, tiltPitch: 58 },
  buildings: false,
  creditsEl: 'credits',
  author: '', nav: null,
  attribution: [
    'Surface temperature: ' + A('https://www.usgs.gov/landsat-missions/landsat-collection-2-level-2-science-products', 'USGS Landsat 8 &amp; 9 Collection 2 Level-2') + ' (ST_B10, QA_PIXEL, ST_QA) via ' + A('https://planetarycomputer.microsoft.com/dataset/landsat-c2-l2', 'Microsoft Planetary Computer') + '; scale 0.00341802, offset 149.0 K (' + A('https://www.usgs.gov/faqs/how-do-i-use-a-scale-factor-landsat-level-2-science-products', 'USGS') + ')',
    'Reservoirs, nature reserve, land use, buildings, coastline: ' + DMC.OSM_CREDIT + ' (ODbL), 1 Nov 2026',
    'Palette: ' + A('https://doi.org/10.5281/zenodo.1243862', 'berlin, Crameri scientific colour maps'),
  ],
};
DMC.mountStamp(DAY);
const map = DMC.createMap(DAY);
window.map = map;

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const f1 = v => v.toFixed(1);
const nf = new Intl.NumberFormat('en-SG');
const fmtDate = (d, t) => {
  const dt = new Date(d + 'T00:00:00Z');
  const s = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' }).format(dt);
  if (!t) return s;
  const [h, m] = t.split(':').map(Number);
  return `${s}, ${h > 12 ? h - 12 : h}:${String(m).padStart(2, '0')} ${h >= 12 ? 'p.m.' : 'a.m.'}`;
};

/* ---------- data ---------- */
let J = null, CODES = null, GW = 0, GH = 0, LUT = null, PAL = null, NORM = null;
const tempOf = c => J.grid.tmin + (c - 2) * J.grid.step;   // code 0 = sea, 1 = land with no reading
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

// The palette is diverging around the island's median: below it runs from the coolest 1% to the
// median, above it from the median to the hottest roofs. Each side is perceptually even.
function colourAt(t) {
  const { lo, mid, hi } = NORM;
  let u = t <= mid ? .5 * Math.max(0, (t - lo) / (mid - lo)) : .5 + .5 * Math.min(1, (t - mid) / (hi - mid));
  u = Math.max(0, Math.min(1, u)) * (PAL.length - 1);
  const i = Math.min(PAL.length - 2, Math.floor(u)), f = u - i;
  return PAL[i].map((v, k) => Math.round(v + (PAL[i + 1][k] - v) * f));
}
function buildLut() {
  LUT = new Uint8ClampedArray(256 * 4);
  LUT.set([44, 48, 56, 255], 4);   // land with no clear reading: flat grey
  for (let c = 2; c < 256; c++) {
    const [r, g, b] = colourAt(tempOf(c));
    LUT.set([r, g, b, 255], c * 4);
  }
}

/* ---------- the heat canvas ---------- */
const heatCanvas = document.createElement('canvas');
let heatCtx = null, heatImg = null;
let filter = { mode: 'all', t: 45 };
function paint() {
  const d = heatImg.data, n = CODES.length, mode = filter.mode, cut = Math.round((filter.t - J.grid.tmin) / J.grid.step) + 2;
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const c = CODES[i];
    if (!c) { d[j + 3] = 0; continue; }
    const k = c * 4;
    const keep = c === 1 || mode === 'all' || (mode === 'hot' ? c >= cut : c < cut);
    if (keep) { d[j] = LUT[k]; d[j + 1] = LUT[k + 1]; d[j + 2] = LUT[k + 2]; d[j + 3] = 255; }
    else { const g = (LUT[k] + LUT[k + 1] + LUT[k + 2]) / 3 * .35 + 14; d[j] = g; d[j + 1] = g; d[j + 2] = g + 3; d[j + 3] = 200; }
  }
  heatCtx.putImageData(heatImg, 0, 0);
  const src = map.getSource('heat');
  if (src) { src.play(); requestAnimationFrame(() => requestAnimationFrame(() => src.pause())); }
}

/* ---------- heat relief: the temperature drawn as terrain, tiles made in the browser ---------- */
const R = 6378137, HALF = Math.PI * R;
const RELIEF_M_PER_C = 10;   // metres of relief per degree above or below the median, before exaggeration
let gridX0 = 0, gridY1 = 0, gridRes = 30;
const mercX = lng => lng * Math.PI / 180 * R;
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * R;
// Relief only: land with no reading takes its nearest reading's height, so gaps don't stand up as walls.
let DEMC = null;
function demCodes() {
  if (DEMC) return DEMC;
  const a = CODES.slice();
  for (let pass = 0; pass < 40; pass++) {
    let left = 0;
    const b = a.slice();
    for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
      const i = r * GW + c;
      if (a[i] !== 1) continue;
      let sum = 0, n = 0;
      if (c > 0 && a[i - 1] > 1) { sum += a[i - 1]; n++; }
      if (c < GW - 1 && a[i + 1] > 1) { sum += a[i + 1]; n++; }
      if (r > 0 && a[i - GW] > 1) { sum += a[i - GW]; n++; }
      if (r < GH - 1 && a[i + GW] > 1) { sum += a[i + GW]; n++; }
      if (n) b[i] = Math.round(sum / n); else left++;
    }
    a.set(b);
    if (!left) break;
  }
  return (DEMC = a);
}
maplibregl.addProtocol('heatdem', async params => {
  const DC = demCodes();
  const [z, x, y] = params.url.replace('heatdem://', '').split('/').map(Number);
  const S = 256, span = 2 * HALF / 2 ** z, tx0 = -HALF + x * span, ty1 = HALF - y * span, px = span / S;
  const img = new ImageData(S, S), d = img.data, mid = NORM.mid;
  for (let r = 0; r < S; r++) {
    const my = ty1 - (r + .5) * px, gr = Math.floor((gridY1 - my) / gridRes);
    for (let c = 0; c < S; c++) {
      const mx = tx0 + (c + .5) * px, gc = Math.floor((mx - gridX0) / gridRes);
      let e = 0;
      if (gr >= 0 && gr < GH && gc >= 0 && gc < GW) { const v = DC[gr * GW + gc]; if (v > 1) e = (tempOf(v) - mid) * RELIEF_M_PER_C; }
      const v = e + 32768, j = (r * S + c) * 4;

let dots = [], skipCam = params.has('view');
$('prev').addEventListener('click', () => goStop(active - 1));
$('next').addEventListener('click', () => goStop(active + 1));
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input, textarea, select, .dmc-stamp')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goStop(active + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goStop(active - 1); }
});

/* ---------- layout: the panel stays clear of the stamp ---------- */
function layout() {
  const st = $('dmc-stamp');
  if (!st.classList.contains('open')) document.documentElement.style.setProperty('--stamp-h', `${Math.round(st.getBoundingClientRect().height)}px`);
}
layout();
if (document.fonts) document.fonts.ready.then(layout);
let rT = 0;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { layout(); if (active >= 0 && !params.has('view')) map.jumpTo((() => { const s = STOPS[active].cam; const padding = camPadding(); if (s.bounds) { const f = map.cameraForBounds(s.bounds, { padding }); return { center: f.center, zoom: f.zoom, pitch: map.getPitch(), bearing: map.getBearing(), padding }; } return { center: s.center, zoom: s.zoom - (isSheet() ? .5 : 0), padding }; })()); }, 180); });

/* ---------- load ---------- */
async function loadCodes(url) {
  const blob = await (await fetch(url)).blob();
  const bmp = await createImageBitmap(blob, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  const d = g.getImageData(0, 0, bmp.width, bmp.height).data, out = new Uint8Array(bmp.width * bmp.height);
  for (let i = 0, j = 0; i < out.length; i++, j += 4) out[i] = d[j];
  return { codes: out, w: bmp.width, h: bmp.height };
}
const styleP = new Promise(res => (map.loaded() ? res() : map.once('load', res)));
const lstP = DMC.loadData('data/day29/lst.js', 'DAY29');   // the code PNG rides inside it as a data URL (j.png)
Promise.all([lstP, lstP.then(j => loadCodes(j.png)), styleP]).then(([j, img]) => {
  J = j; CODES = img.codes; GW = img.w; GH = img.h;
  if (GW !== J.grid.w || GH !== J.grid.h) throw new Error('grid size mismatch');
  gridX0 = mercX(J.grid.bounds[0][0]); gridY1 = mercY(J.grid.bounds[1][1]); gridRes = (mercX(J.grid.bounds[1][0]) - gridX0) / GW;
  PAL = J.palette.map(hex2rgb);
  NORM = { lo: J.norm.lo, mid: J.land.median, hi: J.norm.hi };
  DIST.lo = J.norm.axis[0]; DIST.hi = J.norm.axis[1];
  $('thr').min = DIST.lo; $('thr').max = DIST.hi;
  filter.t = Math.round(J.land.p95 * 2) / 2;
  CUM = new Float64Array(256); for (let c = 2; c < 256; c++) CUM[c] = CUM[c - 1] + J.hist[c - 2];   // CUM[c]: land readings at or below code c
  buildLut();
  distMarks = [
    { key: 'res', label: 'Water', t: J.zones.reservoirs.mean, cool: 1 },
    { key: 'forest', label: 'Forest', t: J.zones.forest.mean, cool: 1 },
    { key: 'mid', label: 'Middle', t: J.land.median },
    { key: 'ind', label: 'Industry', t: J.zones.industrial.mean, hot: 1 },
    { key: 'hot0', label: 'Top roof', t: J.hot[0].peak, hot: 1 },
  ].sort((a, b) => a.t - b.t);
  addLayers();
  addPins();
  setFilter('all');
  buildStops();
  const Z = J.zones.reservoirs;
  $('method').innerHTML = `Each pixel is the median of up to ${J.scenes.length} clear Landsat 8 and 9 passes (${J.scenes.map(s => fmtDate(s.date)).join(', ')}; all at about 11:16 a.m.), from USGS Collection 2 Level-2 band ST_B10: kelvin = value &times; 0.00341802 + 149.0, then minus 273.15 for &deg;C. Passes differ by a few degrees with the weather, so each is first shifted to the same island-wide middle (by ${f1(Math.min(...J.scenes.map(s => s.shift)))}&deg; to +${f1(Math.max(...J.scenes.map(s => s.shift)))}&deg;), which keeps cloud gaps from leaving seams; the hottest-pass readings are as measured. Pixels flagged as cloud, cirrus or shadow in QA_PIXEL are left out, and so is any value more than 6&deg; below its pixel's median (haze the cloud mask missed). Grey land has no reading in any pass: gaps in Landsat&rsquo;s temperature product, mostly where its emissivity input is missing. The thermal sensor sees 100 m squares, which USGS resamples to 30 m, so a &ldquo;roof cluster&rdquo; is a group of big roofs, not one roof. Reservoirs are measured at least 90 m from the shore${Z.nodata.length ? `; ${Z.nodata.join(', ')} ha${Z.nodata.length > 1 ? 've' : 's'} no temperature data from Landsat` : ''}${Z.solar.length ? `; ${Z.solar.map(r => `${r.name}, ${Math.round(r.solar * 100)}% under floating solar panels (OpenStreetMap)`).join(', ')}, ${Z.solar.length > 1 ? 'are' : 'is'} counted apart` : ''}. Catchment forest is the Central Catchment Nature Reserve without its water (grown by 90 m). Industrial estates are all land OpenStreetMap maps as industrial.`;
  dots = STOPS.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = s.kind; b.setAttribute('aria-label', `Stop ${i + 1}: ${s.label}`);
    b.addEventListener('click', () => goStop(i));
    $('dots').append(b);
    return b;
  });
  const start = Math.max(0, Math.min(STOPS.length - 1, (parseInt(params.get('stop') || '1', 10) || 1) - 1));
  if (start === 0) skipCam = true;   // the kit has already framed the island
  goStop(start);
  map.once('idle', () => { $('loading').hidden = true; });
}).catch(err => {
  $('loading').textContent = 'The temperature data could not be loaded. Please reload.';
  console.error(err);
});
</script>
</body></html>
